# .ai/manifest.yaml — the agent-facing contract for this repo.
# Capabilities are tool-NEUTRAL (a name -> the command that fulfils it), and unknown fields MUST be
# ignored — so this survives tool churn and schema growth. Shape reference: personas/.ai/manifest.yaml
schema: ai-manifest
schemaVersion: 0.1.0
generatedAt: "2026-08-24"
generatedFrom: [package.json, playwright.config.ts, tsconfig.json]

repo:
  name: gravity
  purpose: "UI-first content-creation studio — research, script, frames, score, cut — over a governed multi-vendor imaging chokepoint"
  languages: [typescript]

# Capabilities, not tools. Every command below was read out of package.json scripts or verified to be
# backed by a real config + devDependency in this repo; nothing here is invented.
# `verified` is a claim a doctor flips to true once it has actually run the command.
capabilities:
  # package.json scripts
  dev: { command: "npm run dev", verified: false }
  build: { command: "npm run build", verified: false }
  start: { command: "npm run start", verified: false }
  check-notebook: { command: "npm run check:notebook", verified: false }
  # no "test" script exists; the suite is the golden-path probe project in playwright.config.ts
  test: { command: "npx playwright test", verified: false }
  # no tsc script exists; typescript + tsconfig.json are present and this is the repo's real check
  typecheck: { command: "npx tsc --noEmit", verified: false }
  # NOTE: this repo has no linter — no eslint config, no lint script. Do not claim one.

paths:
  contextMap: context-map.json
  patterns: .claude/patterns/
  knowledge: knowledge/
  pipeline: pipeline/
  tests: tests/golden-path/

boundaries:
  # Both are generated by the Personas app from its own database; a hand edit is erased by the next
  # scan and, until then, is read as truth by /perfect, /explorer and /uat.
  neverTouch: [context-map.json, "CLAUDE.md (the personas:context-map block only)"]
  secretsFrom: ".env.local — three NEXT_PUBLIC_FIREBASE_* vars (fail-closed if any is missing) plus per-vendor imaging keys, server-side only"

# The organization's AI registry — knowledge bundles this repo consumes and the skill
# marketplace it installs from. Unknown fields MUST be ignored by a reader.
# registered from the secondary machine (mkdol) 2026-08-24
registry:
  remote: github:xkazm04/ai-registry
  local: ../ai-registry
  machine: secondary
  contributor: mkdol-dev-box
knowledge:
  domains: [software-engineering, media-generation]

# Shared skills this project uses, from the registry's skills/ lane. The LINK is machine
# state (gitignored); THIS list is the reviewable declaration. A skill not listed here is
# project-owned and lives in .claude/skills/ as a real directory.
skills:
  - architect
  - conform
  - consult
  - explorer
  - leonardo
  - perfect
  - research
  - ship-loop
  - tiger
  - uat
