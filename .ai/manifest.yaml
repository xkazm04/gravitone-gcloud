# .ai/manifest.yaml — the agent-facing contract for this repo.
# Capabilities are tool-NEUTRAL (a name -> the command that fulfils it), and unknown fields MUST be
# ignored — so this survives tool churn and schema growth.
#
# THE CONTRACT SHIPS WITH THE ARTIFACT: `.ai/SPEC.md`, in this repository, resolves in a fresh clone
# with no network. It used to cite `personas/.ai/manifest.yaml` — a path outside this repo, which
# resolves to nothing in a clone and forfeited the whole self-describing-clone guarantee.
# `npm run check:manifest` enforces this file against that spec; the spec names every check by id.
schema: ai-manifest
schemaVersion: 0.1.0
generatedAt: "2026-08-24"
generatedFrom: [package.json, playwright.config.ts, tsconfig.json, eslint.config.mjs, .github/workflows/gates.yml]
# 2026-08-24: `test` and `typecheck` scripts were ADDED to package.json by the registry-conformance
# pass, and both commands were then actually run (typecheck clean; 60 probes green) — which is what
# `verified: true` claims below and nothing weaker.

repo:
  name: gravity
  purpose: "UI-first content-creation studio — research, script, frames, score, cut — over a governed multi-vendor imaging chokepoint"
  languages: [typescript]

# Capabilities, not tools. Every command below was read out of package.json scripts or verified to be
# backed by a real config + devDependency in this repo; nothing here is invented.
# `verified` is a claim a doctor flips to true once it has actually run the command.
capabilities:
  # package.json scripts
  dev: { command: "npm run dev", verified: false }
  build: { command: "npm run build", verified: false }
  start: { command: "npm run start", verified: false }
  check-notebook: { command: "npm run check:notebook", verified: false }
  # The suite is the golden-path probe project in playwright.config.ts. It had no script until
  # 2026-08-24: the probes that guard MONEY (imaging-budget) and AUTH (imaging-auth) were runnable
  # only by someone who already knew to type `npx playwright test`, which is a gate nothing invokes.
  test: { command: "npm test", verified: true }
  # THE LIVE LANE — the assembled product in a real browser. Starts `next dev` on
  # port 3187 (never 3000), drives the studio's golden path through a designed
  # control surface, and stops the process it started. It replaced nine
  # `pipeline/drive-*.mjs` scripts that each required a human to start a server
  # first. Run 2026-08-24: 4 journeys green in 19s, and each one watched going
  # red on a seeded failure. See playwright.live.config.ts.
  test-live: { command: "npm run test:live", verified: true }
  # 2026-08-24: the repo had NO linter at all until this date. `lint` is the ratchet wrapper, not bare
  # eslint — it holds errors at zero AND freezes the pre-existing warning population per rule against
  # lint-baseline.json. Run, 0 errors / 21 warnings / 4 buckets at baseline.
  lint: { command: "npm run lint:ratchet", verified: true }
  # Checks THIS file against .ai/SPEC.md. Run, clean.
  check-manifest: { command: "npm run check:manifest", verified: true }
  # The reasoning engine's live pass. NOT in `npm test` on purpose: it talks to a vendor, so it can
  # go red for reasons that are nobody's fault. Free by default (posture + zero-token probes);
  # `-- --roster` lists what the key can reach; `-- --spend` sends real turns. Run in all three
  # modes 2026-08-27 — and `--roster` is what caught a model id that did not exist.
  verify-text: { command: "npm run verify:text", verified: true }
  # Reads the BUILT browser chunks for server-only variable names, live secret values and
  # server-module fingerprints. Requires a build first; run in both directions on 2026-08-24
  # (clean on the real tree; red on a seeded client import of lib/imaging/budget).
  check-bundle: { command: "npm run check:bundle", verified: true }
  # `strict: true` in tsconfig.json; this is the repo's real check and, until the script above
  # existed, the only one that ran automatically (via `next build`).
  typecheck: { command: "npm run typecheck", verified: true }
  # (Was, until 2026-08-24: "this repo has no linter". It has one now — eslint.config.mjs, flat
  # config over eslint-config-next@16.3.0, wired into .github/workflows/gates.yml.)

paths:
  spec: .ai/SPEC.md
  contextMap: context-map.json
  patterns: .claude/patterns/
  knowledge: knowledge/
  pipeline: pipeline/
  # Two lanes, and membership is by LOCATION: tests/golden-path/ is the Node
  # probe lane (`npm test`), tests/live/ is the browser lane (`npm run
  # test:live`). The pointer is the parent so neither is invisible to a reader.
  tests: tests/

boundaries:
  # Both are generated by the Personas app from its own database; a hand edit is erased by the next
  # scan and, until then, is read as truth by /perfect, /explorer and /uat.
  neverTouch: [context-map.json, "CLAUDE.md (the personas:context-map block only)"]
  secretsFrom: ".env.local — three NEXT_PUBLIC_FIREBASE_* vars (fail-closed if any is missing) plus per-vendor imaging keys and GOOGLE_AI_API_KEY (shared by the imaging and text seams), server-side only"

# 2026-08-27: the reasoning seam. Two routes (/api/recalibrate, /api/frames) reached a local `claude`
# subprocess directly; that transport cannot exist on a managed platform, which blocked the hosted
# posture on the two routes with no abstraction. lib/text/ is now the chokepoint and it walks a
# fallback ladder — local CLI, then a metered Gemini key, then honest refusal. Recorded here because
# ONE OF THE TWO RUNGS IS UNVERIFIED and that is not something to leave for someone to discover.
engines:
  text:
    chokepoint: lib/text/router.ts
    plan: docs/llm-seam-plan.md
    rungs:
      # Unchanged by this work and fully exercised: it is the same lib/claudeCli.ts transport the two
      # routes always used, now behind the contract, plus a metered-key strip at the spawn door.
      - { id: claude-cli, transport: local-subprocess, billing: "operator's logged-in subscription", verified: true }
      # VERIFIED 2026-08-27 by `npm run verify:text -- --spend`, which drove real turns through
      # lib/text/router.ts against a live AI Studio key: cloud posture served edit-plan on
      # gemini-3.1-pro-preview at rung=preferred with NATIVE schema enforcement (7.3s); local posture
      # with LOCAL_BINARIES=off descended to gemini-3.6-flash at rung=alternate carrying
      # reroutedFrom=claude-cli:policy-forbidden (4.2s); and with neither engine available the bottom
      # of the ladder refused, naming both candidates. Cost is still `unpriced` — the token counts
      # arrive, the RATE is unread (lib/text/pricing.ts says so per row).
      - { id: google, transport: cloud-api, billing: "metered GOOGLE_AI_API_KEY", verified: true }
  # What this deployment can actually do (lib/capabilities.ts). All default ON; a hosted deployment
  # turns off what has no Google Cloud equivalent. NOT a security boundary — the money-route gate in
  # lib/apiAuth.ts is, and it fails closed independently.
  capabilityFlags: lib/capabilities.ts

# The organization's AI registry — knowledge bundles this repo consumes and the skill
# marketplace it installs from. Unknown fields MUST be ignored by a reader.
# registered from the secondary machine (mkdol) 2026-08-24
registry:
  remote: github:xkazm04/ai-registry
  local: ../ai-registry
  machine: secondary
  contributor: mkdol-dev-box
knowledge:
  domains: [software-engineering, media-generation]

# Shared skills this project uses, from the registry's skills/ lane. The LINK is machine
# state (gitignored); THIS list is the reviewable declaration. A skill not listed here is
# project-owned and lives in .claude/skills/ as a real directory.
skills:
  - architect
  - conform
  - consult
  - explorer
  - leonardo
  - perfect
  - research
  - ship-loop
  - tiger
  - uat
