# ==============================================================================
# THE BINDING RUNG.
#
# Before this file existed, every check in this repository was a courtesy: the
# probes that guard MONEY (`imaging-budget`) and AUTH (`imaging-auth`) ran only
# when a human already knew to type the command. A check that runs only when
# asked is not a gate — nothing here refuses anything. This workflow is the
# moment of refusal. (registry: quality-gates/gate-laddering, "a check that runs
# only locally is a courtesy, not a gate".)
#
# ------------------------------------------------------------------------------
# GRADING: blocking vs advisory, decided on INPUT DETERMINISM, not on severity.
# (registry: quality-gates/blocking-by-input-determinism.)
#
# The question asked of every job below is NOT "how serious are its findings" but
# "could this same commit, re-checked next month, produce a different answer with
# nobody changing anything?" If no, the job may block. If yes, it may not, because
# a blocking gate promises the author it stops that they can make it green.
#
#   install (npm ci)     BLOCKING.  Input: package.json + package-lock.json, both
#                        committed. The lockfile pins exact versions AND integrity
#                        hashes, so the registry is "nominally external but
#                        effectively pinned" — deterministic given the commit.
#                        Changes the answer: nothing; this stays blocking.
#
#   typecheck            BLOCKING.  Input: this repo's own .ts/.tsx/.mts sources
#                        plus a `typescript` version resolved from the committed
#                        lock. Nothing outside the tree can move the verdict.
#                        Changes the answer: nothing; this stays blocking.
#
#   lint                 BLOCKING at error severity, RATCHETED at warning
#                        severity. Input: this repo's sources plus a rule set
#                        pinned by eslint-config-next@16.3.3 in the committed
#                        lock — deterministic. Error count is held at zero
#                        outright. The warning population is pre-existing debt
#                        (React-Compiler hook analyses over the studio's
#                        load-first hooks), frozen bucket-by-bucket in
#                        `lint-baseline.json`; the ratchet refuses any movement in
#                        EITHER direction. This is debt-shaped advisory with an
#                        expiry, not input-shaped advisory.
#                        Changes the answer: a bucket reaching 0 — delete it from
#                        lint-baseline.json AND from eslint.config.mjs, and the
#                        rule stands at plain blocking severity.
#
#   manifest             BLOCKING.  Input: .ai/manifest.yaml against .ai/SPEC.md,
#                        both committed here, plus the package.json scripts and
#                        repository paths the manifest names. Nothing outside the
#                        tree can move the verdict.
#                        Changes the answer: nothing; this stays blocking.
#
#   notebook             BLOCKING.  Input: the notebook graph under
#                        app/_phases/_shared/notebook/ — this repo's own sources
#                        and nothing else. `pipeline/check-notebook.mts` resolves
#                        the string ids the graph is held together by and exits
#                        non-zero on an id spent twice, a reference to nothing, or
#                        an untagged card. No network: grep the script for fetch,
#                        http, or a key name and it has none.
#                        Changes the answer: nothing; this stays blocking.
#
#   trailer structure    BLOCKING.  Input: knowledge/templates/** and the trailer
#                        structure module, both committed here.
#                        `pipeline/trailer-structure-regression.mts` walks 22
#                        cases, 6 invariants and 5 seam checks over them and exits
#                        non-zero on a disagreement. No network, same as above.
#                        Changes the answer: if a case is ever grounded in a live
#                        corpus rather than a committed one, that case moves to an
#                        advisory job on a schedule; it may not stay in here.
#
#   probes               BLOCKING.  Input: the repo's own modules. The suite is
#                        Node-context with no browser and no webServer, and
#                        `sealNetwork()` in the imaging probes proves no call
#                        leaves the process — so there is no live service whose
#                        mood can redden a clean tree.
#                        Changes the answer: if a probe is ever pointed at a real
#                        vendor, that probe must be split out into its own
#                        advisory job on a schedule; it may not stay in here.
#
#   live                 BLOCKING, and it is its OWN JOB — see below for why that
#                        is not a stylistic choice. Input: this repo's sources, a
#                        `@playwright/test` version resolved from the committed
#                        lock, and the Chromium build that version pins (fetched
#                        by `npx playwright install`, which is the same
#                        "nominally external but effectively pinned" shape as
#                        `npm ci` and is already accepted as deterministic
#                        above). The lane runs `next dev` on a NON-DEFAULT port
#                        it starts and stops itself, drives the studio's golden
#                        path in a real browser, and reaches NO network service:
#                        the research run it exercises is a local mocked clock
#                        (app/_phases/research/run/useResearchRun.ts) and the
#                        imaging routes are never touched. Nothing outside the
#                        tree can move the verdict, so it may block.
#                        Changes the answer: pointing any journey at a real
#                        vendor, or at anything behind a network call — that
#                        journey must then be split into its own advisory job on
#                        a schedule. `retries` staying at 0 in
#                        playwright.live.config.ts is the standing signal that
#                        this grading is still honest; the day somebody needs a
#                        retry to get green is the day this line is wrong.
#
#                        WHY A SEPARATE JOB. It is the only check here that needs
#                        a browser binary (~150MB) and minutes of wall clock, and
#                        it is the only one whose failure means something
#                        different from the others': the seven checks in `gates`
#                        read what was WRITTEN, this one reports on what the
#                        assembled product DID. Folding it in would make a
#                        two-minute typo cost a browser download, and would hide
#                        which half of the ladder actually broke.
#
#   build                BLOCKING.  Input: the committed sources and lock. Runs
#                        with NO environment variables on purpose — the repo's
#                        optional-dependency contract says an absent key must
#                        degrade, not crash, and a green build with an empty env
#                        is the proof of it.
#                        Changes the answer: nothing; this stays blocking.
#
#   bundle               BLOCKING.  Reads the browser chunks the build just
#                        emitted for server-only variable names, live secret
#                        values, server-module fingerprints and the LIVE-HARNESS
#                        CONTROL SURFACE, whose build-time gate is only provable
#                        from the emitted output. Input: the output
#                        of the deterministic build above, so deterministic too.
#                        It runs AFTER build because it is the only check in the
#                        project that reads what SHIPPED rather than what was
#                        written — a module imported by both a route and a client
#                        component inlines into browser output with no line of
#                        source saying so.
#                        Changes the answer: nothing; this stays blocking.
#
# NO SUPPLY-CHAIN JOB IS WIRED, AND THAT IS THE HONEST ANSWER, NOT AN OVERSIGHT.
# `npm audit` reads an advisory feed that moves without this repository: an entry
# published overnight against a transitive dependency would wall the next
# unrelated pull request, which is a true positive and still an illegitimate
# refusal. Its correct form is a scheduled advisory job with a named human reading
# the output — and this repo has no such rotation staffed. Per the technique, a
# project whose advisory findings reach nobody does not have an advisory
# supply-chain check; it has none. Recording the absence here, dated and
# deliberate, is the requirement that absence carries.
# Changes the answer: someone takes the rotation. Then add a `schedule:`-triggered
# `npm audit --omit=dev` job, advisory, and name its reader in this header.
#
# ------------------------------------------------------------------------------
# ONE AUTHORITY FOR THE RULE SET. Every job below invokes an npm script that a
# developer runs identically on their own machine (`npm run typecheck`,
# `npm run lint:ratchet`, `npm run check:manifest`, `npm test`, `npm run build`,
# `npm run check:bundle`, `npm run test:live`).
# There is no second, CI-only definition of any check to drift against the local one.
# ==============================================================================

name: gates

on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same ref makes the older run's verdict irrelevant.
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # `npm run verify` (package.json) mirrors this job's blocking steps after
    # install, in the same order: typecheck, lint:ratchet, check:manifest,
    # check:notebook, check:trailer-structure, test, build, check:bundle. The
    # pre-push hook runs it before any push to main.
    # If a step is added, removed, or reordered here, change `verify` in the
    # same commit — the two must not drift.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # BLOCKING. `npm ci` — not `npm install` — so the lockfile is authority and
      # a lock that disagrees with package.json is itself a failure.
      #
      # FOOTGUN, MEASURED 2026-08-24. This repo is maintained from Windows, and
      # `npm install` there resolves only the optional native/wasm packages that
      # match the host platform. The hoisted entries the LINUX tree needs
      # (@emnapi/core, @emnapi/runtime — pulled in by @tailwindcss/oxide-wasm32-wasi
      # and @img/sharp-wasm32) get pruned out of the lock, and this step is the
      # only thing in the project that can see it. `npm install
      # --package-lock-only` on Windows will strip them again. If this step ever
      # reports "Missing: @emnapi/... from lock file", re-add the hoisted entries
      # rather than regenerating the lock on a Windows box.
      - name: install
        run: npm ci

      # BLOCKING. Fast, and it covers pipeline/*.mts and tests/, which the
      # production build does not compile.
      - name: typecheck
        run: npm run typecheck

      # BLOCKING at error severity; ratcheted at warning severity.
      # `npm run lint:ratchet` is the same command a developer runs locally. It has
      # three outcomes and three exit codes — 0 pass, 1 fail, 2 COULD-NOT-RUN —
      # and it asserts its own instrument (a short file walk is fatal, never
      # "clean"). See pipeline/lint-ratchet.mjs.
      - name: lint (errors at zero, warning debt ratcheted)
        run: npm run lint:ratchet

      # BLOCKING. Checks .ai/manifest.yaml against .ai/SPEC.md, the contract that
      # ships in this repository. Input: two committed files plus package.json and
      # the paths they name — entirely deterministic. Same three outcomes and
      # three exit codes as the lint ratchet; a manifest that parses to nothing is
      # could-not-run, never a clean pass.
      # Changes the answer: nothing; this stays blocking.
      - name: manifest
        run: npm run check:manifest

      # BLOCKING, and new to the ladder on 2026-08-29 — both of these already
      # existed, were already wired to npm scripts, were already free (offline,
      # deterministic, sub-second) and were guarded by NOTHING: neither `verify`
      # nor this workflow ran them, so the invariants they hold were checked only
      # when somebody remembered to type the command.
      #
      # They sit here, after the manifest and before the probes, because they are
      # the same shape as the checks above — cheap, deterministic, and answering
      # a question about committed content rather than about built output. A gate
      # that costs a second belongs in front of the one that costs a minute.
      - name: notebook graph
        run: npm run check:notebook

      - name: trailer structure
        run: npm run check:trailer-structure

      # BLOCKING. Node-context probes. Not skipped when earlier steps are
      # green-but-uninteresting: this is the rung that refuses.
      - name: probes
        run: npm test

      # BLOCKING. Deliberately no `env:` block — see the header.
      - name: build
        run: npm run build

      # BLOCKING, and it must run after `build`: it inspects the emitted browser
      # chunks, which is the only way to see a server-only module that got inlined
      # into client output. Three outcomes, three exit codes, and it asserts a
      # POSITIVE CONTROL before reporting clean — a grep over the wrong directory
      # says "no leaks found" in a voice indistinguishable from success.
      - name: bundle (browser/credential boundary)
        run: npm run check:bundle

  # ============================================================================
  # THE LIVE LANE — the assembled product, in a real browser.
  #
  # BLOCKING; graded in the header above. Its own job because it is the only
  # check here that needs a browser binary and minutes of wall clock, and because
  # its failure means something the other seven cannot say: not "what was written
  # is wrong" but "what ships does not do the thing".
  #
  # It runs INDEPENDENTLY of `gates` rather than after it. A live failure and a
  # typecheck failure are different findings and a reader wants both on the same
  # run, not the second one hidden behind the first.
  # ============================================================================
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: install
        run: npm ci

      # The browser, at the version `@playwright/test` pins in the committed
      # lockfile — not "latest Chrome". `--with-deps` installs the shared
      # libraries a headless Chromium needs on a bare runner; without it the
      # launch fails with a missing-.so error that reads like a test failure.
      - name: install chromium
        run: npx playwright install --with-deps chromium

      # BLOCKING. Starts `next dev` on port 3187 (NOT 3000), waits for it,
      # drives the golden path, and stops the process it started — see
      # playwright.live.config.ts, which owns the launcher and states why the
      # lane is serial.
      #
      # NO `env:` BLOCK, deliberately, and it is the same reasoning as `build`'s:
      # the lane must run with no Firebase configuration at all. The auth bypass
      # it drives through (lib/devAuth.ts) does not use Firebase, and a green run
      # with an empty environment is the proof that the bypass — not a real
      # credential that leaked into CI — is what opened the gate.
      - name: live (golden path, real browser)
        run: npm run test:live

      # The traces and screenshots the lane keeps ONLY for failures. Uploaded
      # only when something failed, because a slow lane whose failures cannot be
      # diagnosed without re-running it is a lane people learn to re-run.
      - name: failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-lane-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
