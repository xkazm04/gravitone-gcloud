<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Foundry | Gravitone — Almanac</title>
<style>
:root{
  --night:#0A1230; --deep:#060A1C; --field:#121C44; --gold:#D9B26A; --white:#F3EEDF; --vellum:#B9B4A4; --ald:#E2704F; --ant:#EE6A8C; --ash:#8C93B3;
  --line:rgba(217,178,106,.2); --line2:rgba(217,178,106,.42);
  --ease:cubic-bezier(.2,.7,.1,1);
  --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
  --sans:"Gill Sans","Segoe UI Variable Text","Segoe UI Variable","Segoe UI",Optima,Candara,sans-serif;
  --pad:clamp(16px,2.6vw,44px); --bar:60px; --tabs:58px;
}
*{box-sizing:border-box}
html{background:var(--deep)}
body{margin:0;min-height:100vh;color:var(--white);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;
  background:radial-gradient(120% 70% at 50% -12%, #16225A 0%, #0E1738 30%, #0A1230 55%, #070C23 100%) fixed;padding-bottom:96px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:not-allowed}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.sc{text-transform:uppercase;letter-spacing:.16em;font-size:12.5px;font-variant-numeric:tabular-nums lining-nums}
.it{font-family:var(--serif);font-style:italic;font-weight:400}
.num{font-variant-numeric:tabular-nums lining-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--vellum)}
kbd{font-family:var(--sans);font-size:12px;letter-spacing:.04em;border:1px solid rgba(185,180,164,.5);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--white);min-width:20px;display:inline-block;text-align:center;line-height:18px}
#sky{position:fixed;inset:0;pointer-events:none;z-index:0}
#sky svg{width:100%;height:100%}
.wrap{position:relative;z-index:1;max-width:min(2200px,100%);margin:0 auto;padding:0 var(--pad)}

/* ---------- top bar ---------- */
#bar{position:sticky;top:0;z-index:40;height:var(--bar);display:flex;align-items:center;gap:22px;padding:0 var(--pad);
  background:linear-gradient(rgba(6,10,28,.94),rgba(6,10,28,.86));backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--white);flex:none}
.brand svg.mk{width:30px;height:30px;overflow:visible}
.brand svg.wm{height:14px;width:auto;overflow:visible}
#crumbs{display:flex;align-items:center;gap:9px;list-style:none;margin:0;padding:0;min-width:0;overflow:hidden;white-space:nowrap}
#crumbs li{display:flex;align-items:center;gap:9px;flex:none}
#crumbs li:last-child{flex:0 1 auto;min-width:0}
#crumbs button,#crumbs a{color:var(--vellum);text-decoration:none}
#crumbs button:hover,#crumbs a:hover{color:var(--gold)}
#crumbs [aria-current]{color:var(--white);overflow:hidden;text-overflow:ellipsis}
#crumbs .sep{color:var(--gold);opacity:.7;letter-spacing:0}
.barR{margin-left:auto;display:flex;align-items:center;gap:14px;flex:none}
.tag{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);border:1px solid var(--line2);border-radius:3px;padding:1px 7px;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden}
.seg button{padding:5px 11px;color:var(--vellum)}
.seg button[aria-pressed="true"]{background:rgba(217,178,106,.16);color:var(--white)}
.seg button:hover{color:var(--gold)}
.seglab{color:var(--vellum)}

/* ---------- head ---------- */
#head{display:grid;grid-template-columns:1fr auto;align-items:end;gap:24px;padding-top:22px}
#head h1{margin:2px 0 0;font:italic 400 clamp(44px,4.4vw,76px)/1 var(--serif);letter-spacing:-.01em}
#head .eb{color:var(--gold)}
#fornax{width:clamp(280px,26vw,440px);height:auto;overflow:visible;display:block}
#fornax .ln{fill:none;stroke:var(--gold);stroke-width:1;stroke-opacity:.55;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 1;stroke-dashoffset:1;transition:stroke-dashoffset 1.6s var(--ease)}
#fornax .ln.f{stroke-opacity:.3;stroke-width:.8}
#fornax .ast{fill:none;stroke:var(--gold);stroke-opacity:.5;stroke-width:1;stroke-dasharray:1 5;stroke-linecap:round}
body.lit #fornax .ln{stroke-dashoffset:0}
#fornax .st{cursor:pointer}
#fornax .st circle.c{fill:var(--white);transition:r .5s var(--ease)}
#fornax .st circle.h{fill:none;stroke:var(--ald);stroke-width:1.2;opacity:0;transform-box:fill-box;transform-origin:center;transform:scale(.4);transition:opacity .6s var(--ease),transform .8s var(--ease)}
#fornax .st.on circle.h{opacity:1;transform:none}
#fornax text{fill:var(--vellum);font:12px var(--sans);letter-spacing:.16em;text-transform:uppercase}
#fornax .st.on text{fill:var(--white)}
.figcap{display:flex;justify-content:flex-end;gap:10px;margin-top:4px;color:var(--vellum)}

/* ---------- tab rail ---------- */
#tabs{position:sticky;top:var(--bar);z-index:30;margin-top:12px;height:var(--tabs);display:flex;align-items:stretch;gap:clamp(14px,2.6vw,40px);
  background:linear-gradient(rgba(8,13,36,.97),rgba(8,13,36,.9));backdrop-filter:blur(8px);border-bottom:1px solid var(--line);margin-left:calc(-1*var(--pad));margin-right:calc(-1*var(--pad));padding:0 var(--pad);overflow-x:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{position:relative;display:flex;align-items:center;gap:10px;color:var(--vellum);white-space:nowrap;padding:0 2px}
.tab .nm{font:italic 400 22px/1 var(--serif)}
.tab:hover{color:var(--white)}
.tab[aria-selected="true"]{color:var(--white)}
.tab::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:radial-gradient(circle,var(--gold) 1.2px,transparent 1.6px) 0 50%/7px 3px repeat-x;transform:scaleX(0);transform-origin:0 50%;transition:transform .7s var(--ease)}
.tab[aria-selected="true"]::after{transform:none}
.tally{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(185,180,164,.45);border-radius:999px;padding:0 9px;height:22px;font-size:12.5px;letter-spacing:.06em;font-variant-numeric:tabular-nums;color:var(--white)}
.tally.amber{border-color:var(--gold);background:rgba(217,178,106,.16);color:var(--white)}
.tally.amber::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px 2px rgba(217,178,106,.6);animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.35}}
.tabkeys{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--vellum)}

/* ---------- common blocks ---------- */
#view{padding-top:24px}
.two{display:grid;grid-template-columns:250px minmax(0,1fr);gap:clamp(18px,2.2vw,36px);align-items:start}
.side{position:sticky;top:calc(var(--bar) + var(--tabs) + 18px)}
.sideh{color:var(--vellum);display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.item{width:100%;display:grid;grid-template-columns:18px 1fr;gap:4px 10px;text-align:left;padding:10px 12px;border:1px solid transparent;border-left:2px solid transparent;border-radius:3px;transition:background .3s,border-color .3s}
.item:hover{background:rgba(217,178,106,.06)}
.item[aria-current="true"]{background:rgba(217,178,106,.1);border-color:var(--line);border-left-color:var(--gold)}
.item .gl{grid-row:span 2;margin-top:3px}
.item .id{font-size:15px;font-variant-numeric:tabular-nums;color:var(--white);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .st{font-size:13px;color:var(--vellum)}
.item .st b{font-weight:400;color:var(--white)}
.gl{width:16px;height:16px;overflow:visible;flex:none;display:inline-block;vertical-align:-3px}
.gl .spin{animation:spin 6s linear infinite;transform-origin:center;transform-box:fill-box}
@keyframes spin{to{transform:rotate(360deg)}}
.err{color:var(--ant);font-size:14.5px}
.errbox{border:1px solid rgba(238,106,140,.45);background:rgba(238,106,140,.08);color:#F7B9C9;padding:10px 12px;border-radius:3px;font-size:14.5px}
.errbox b{color:var(--ant);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:9px 18px;font-size:14px;letter-spacing:.02em;white-space:nowrap;transition:background .25s,border-color .25s,color .25s,opacity .25s}
.btn.gold{background:var(--gold);color:var(--night);font-weight:600;box-shadow:0 0 0 1px rgba(255,230,170,.35) inset,0 6px 24px rgba(217,178,106,.22)}
.btn.gold:hover:not(:disabled){background:#E6C47E}
.btn.gold:disabled{background:rgba(217,178,106,.2);color:rgba(243,238,223,.55);box-shadow:none}
.btn.ghost{border:1px solid var(--line2);color:var(--white)}
.btn.ghost:hover:not(:disabled){background:rgba(217,178,106,.1);border-color:var(--gold)}
.btn.danger{border:1px solid var(--ant);color:#FFD5DF;background:rgba(238,106,140,.14)}
.btn.danger:hover:not(:disabled){background:rgba(238,106,140,.28)}
.btn.sm{padding:5px 12px;font-size:13px}
.btn:disabled{opacity:.7}
.ghost-rows{display:flex;flex-direction:column;gap:6px}
.ghost-rows i{display:block;height:44px;border:1px dashed rgba(185,180,164,.28);border-radius:3px}
.ghostlab{color:var(--vellum);margin-top:8px}
pre.cmd{margin:8px 0 0;font:14px/1.6 Consolas,"Cascadia Mono",monospace;color:var(--white);background:rgba(6,10,28,.6);border:1px solid var(--line);padding:10px 12px;border-radius:3px;white-space:pre-wrap}
code{font:13.5px Consolas,"Cascadia Mono",monospace;color:var(--gold)}

/* status strip */
.strip{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;border:1px solid var(--line);background:rgba(18,28,68,.45);padding:11px 16px;border-radius:3px}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid;border-radius:999px;padding:2px 11px 2px 8px;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.pill.live{border-color:var(--gold);color:var(--gold)}
.pill.ready{border-color:rgba(243,238,223,.6);color:var(--white)}
.pill.inc{border-color:var(--gold);color:var(--gold)}
.pill.failed{border-color:var(--ant);color:var(--ant)}
.pill.committed{border-color:rgba(243,238,223,.5);color:var(--white);background:rgba(243,238,223,.07)}
.facts{font-size:14px;color:var(--vellum)}
.facts b{font-weight:400;color:var(--white)}
.log{margin-left:auto;font-size:13.5px;color:var(--vellum);max-width:48ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meridian{flex-basis:100%;height:10px;position:relative;margin-top:2px}
.meridian::before{content:"";position:absolute;left:0;right:0;top:4px;height:2px;background:radial-gradient(circle,rgba(217,178,106,.4) .9px,transparent 1.3px) 0 50%/7px 2px repeat-x}
.meridian i{position:absolute;left:0;top:3px;height:4px;border-radius:2px;background:linear-gradient(90deg,rgba(217,178,106,.4),var(--gold));transition:width .6s var(--ease)}
.meridian i::after{content:"";position:absolute;right:-4px;top:-3px;width:10px;height:10px;border-radius:50%;background:var(--white);box-shadow:0 0 10px 3px rgba(217,178,106,.6)}
.report{margin-top:14px;border:1px solid rgba(243,238,223,.3);background:rgba(243,238,223,.04);padding:12px 16px;border-radius:3px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.report .sc{color:var(--white)}

/* ---------- cull ---------- */
.scene{display:grid;grid-template-columns:clamp(220px,17vw,300px) minmax(0,1fr);gap:clamp(16px,1.8vw,28px);margin-top:22px}
.src{position:sticky;top:calc(var(--bar) + var(--tabs) + 18px);align-self:start}
.frame{position:relative;padding:8px}
.frame img{display:block;width:100%;border-radius:1px}
.frame .reg{position:absolute;width:13px;height:13px;border-color:var(--gold);border-style:solid;opacity:.8}
.frame .reg.a{left:0;top:0;border-width:1px 0 0 1px}.frame .reg.b{right:0;top:0;border-width:1px 1px 0 0}
.frame .reg.c{left:0;bottom:0;border-width:0 0 1px 1px}.frame .reg.d{right:0;bottom:0;border-width:0 1px 1px 0}
.src .lab{color:var(--gold);margin-top:6px}
.src p{margin:4px 0 10px;color:var(--vellum);font-size:15px;line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(185,180,164,.3);border-radius:3px;padding:1px 7px;font-size:12.5px;color:var(--vellum);line-height:1.5;white-space:nowrap}
.chip b{font-weight:400;color:var(--white)}
.src .from{font-size:13px;color:var(--vellum);margin-top:8px}
.mx{overflow-x:auto;padding-bottom:6px}
.grid{display:grid;gap:10px;min-width:min-content}
.colh{padding:0 2px 4px}
.colh .sc{color:var(--white)}
.colh div+div{font-size:13.5px;color:var(--vellum)}
.rowh{display:flex;flex-direction:column;justify-content:center;padding-right:6px;min-width:0}
.rowh .nm{font:italic 400 19px/1.15 var(--serif)}
.rowh .fm{font-size:13px;color:var(--vellum);margin-top:2px}
.rowk{display:flex;gap:5px;margin-top:8px}
.rk{border:1px solid rgba(185,180,164,.4);border-radius:3px;padding:1px 8px;font-size:12.5px;letter-spacing:.08em;color:var(--vellum)}
.rk:hover{color:var(--white);border-color:var(--white)}
.rk.k.on{border-color:var(--ald);color:var(--white);background:rgba(226,112,79,.22)}
.rk.x.on{border-color:var(--ash);color:var(--white);background:rgba(140,147,179,.2)}
.tile{position:relative;overflow:hidden;background:#050815;border-radius:2px;outline:none;transition:transform .4s var(--ease)}
.tile::before{content:"";position:absolute;inset:0;border:1px solid rgba(217,178,106,.24);border-radius:2px;z-index:3;pointer-events:none;transition:border-color .3s}
.tile img{display:block;width:100%;height:100%;object-fit:cover;cursor:zoom-in;transition:filter .6s var(--ease),opacity .6s var(--ease)}
.tile .occ{position:absolute;z-index:2;width:120%;aspect-ratio:1;border-radius:50%;top:50%;left:50%;background:radial-gradient(circle at 40% 45%,rgba(6,10,28,.9),rgba(6,10,28,.78) 62%,rgba(6,10,28,0) 71%);
  transform:translate(60%,-50%);opacity:0;pointer-events:none;transition:transform .8s var(--ease),opacity .5s var(--ease)}
.tile.v-reject img{filter:grayscale(.85) brightness(.55)}
.tile.v-reject .occ{opacity:1;transform:translate(-38%,-50%)}
.tile.v-keep::before{border:2px solid var(--ald)}
.tile .ring{position:absolute;inset:0;z-index:3;pointer-events:none;width:100%;height:100%}
.tile .ring rect{fill:none;stroke:var(--ald);stroke-width:2;stroke-dasharray:1 1;stroke-dashoffset:1;opacity:0}
.tile.v-keep .ring rect{animation:draw .7s var(--ease) both}
@keyframes draw{0%{opacity:1;stroke-dashoffset:1}99%{opacity:1;stroke-dashoffset:0}100%{opacity:0;stroke-dashoffset:0}}
.tile .fl{position:absolute;z-index:4;left:14px;top:16px;width:90px;height:1px;margin-left:-45px;background:linear-gradient(90deg,transparent,rgba(255,220,190,.95),transparent);opacity:0;pointer-events:none}
.tile.v-keep.fresh .fl{animation:flare 1.1s var(--ease) both}
.tile.v-keep.fresh .fl.v{transform:rotate(90deg)}
.tile.v-keep.fresh .fl.v{animation-name:flarev}
@keyframes flare{0%{opacity:0;transform:scaleX(.2)}30%{opacity:1;transform:scaleX(1)}100%{opacity:0;transform:scaleX(.5)}}
@keyframes flarev{0%{opacity:0;transform:rotate(90deg) scaleX(.2)}30%{opacity:1;transform:rotate(90deg) scaleX(1)}100%{opacity:0;transform:rotate(90deg) scaleX(.5)}}
.tile.focus::before{border-color:var(--gold)}
.tile .cn{position:absolute;z-index:4;width:14px;height:14px;border-color:var(--gold);border-style:solid;opacity:0;pointer-events:none;transition:opacity .25s,transform .35s var(--ease)}
.tile .cn.a{left:5px;top:5px;border-width:2px 0 0 2px;transform:translate(5px,5px)}.tile .cn.b{right:5px;top:5px;border-width:2px 2px 0 0;transform:translate(-5px,5px)}
.tile .cn.c{left:5px;bottom:5px;border-width:0 0 2px 2px;transform:translate(5px,-5px)}.tile .cn.d{right:5px;bottom:5px;border-width:0 2px 2px 0;transform:translate(-5px,-5px)}
.tile.focus .cn{opacity:1;transform:none}
.tile.focus{box-shadow:0 0 0 1px var(--gold),0 0 0 5px rgba(217,178,106,.16)}
.stamp{position:absolute;z-index:5;left:7px;top:7px;display:none;align-items:center;gap:5px;border-radius:2px;padding:1px 7px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;pointer-events:none}
.v-keep .stamp.k{display:inline-flex;background:var(--ald);color:#1B0C06}
.v-reject .stamp.x{display:inline-flex;background:rgba(6,10,28,.9);color:var(--white);border:1px solid var(--ash)}
.tchips{position:absolute;z-index:5;left:7px;bottom:7px;right:7px;display:flex;flex-wrap:wrap;gap:4px;pointer-events:none}
.sch{display:inline-flex;align-items:center;gap:5px;background:rgba(6,10,28,.86);border:1px solid rgba(185,180,164,.28);border-radius:2px;padding:0 6px;font-size:12px;line-height:19px;color:var(--white);font-variant-numeric:tabular-nums;white-space:nowrap}
.sch.lo{color:#C9CEE3}
.sch.veto{border-color:var(--ant);color:#FFD2DC;background:rgba(60,10,26,.9);font-weight:600;letter-spacing:.12em}
.sch.unm{border-style:dashed;border-color:var(--gold);color:var(--gold)}
.sch svg{width:9px;height:9px;overflow:visible}
.vb{position:absolute;z-index:6;right:7px;top:7px;display:flex;gap:4px;opacity:0;transition:opacity .25s}
.tile:hover .vb,.tile.focus .vb,.tile.v-keep .vb,.tile.v-reject .vb{opacity:1}
.vb button{width:28px;height:26px;border-radius:2px;font-size:13px;font-weight:700;background:rgba(6,10,28,.88);border:1px solid rgba(243,238,223,.35)}
.vb button.k:hover,.vb button.k.on{background:var(--ald);border-color:var(--ald);color:#1B0C06}
.vb button.x:hover,.vb button.x.on{background:var(--ash);border-color:var(--ash);color:var(--deep)}
.tempty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px;text-align:center;font-size:13px;color:var(--vellum);
  background:repeating-linear-gradient(135deg,rgba(217,178,106,.04) 0 1px,transparent 1px 9px)}
.tempty.failed{color:#F7B9C9;background:repeating-linear-gradient(135deg,rgba(238,106,140,.07) 0 1px,transparent 1px 9px)}
.tempty.failed b{color:var(--ant)}
.tempty b{font-weight:400;color:var(--white);letter-spacing:.14em;text-transform:uppercase;font-size:12.5px}
.tempty svg{width:34px;height:34px;overflow:visible}
.tempty .bar{width:70%;height:3px;background:rgba(217,178,106,.18);border-radius:2px;overflow:hidden}
.tempty .bar i{display:block;height:100%;background:var(--gold);transition:width .8s linear}

/* ---------- dock ---------- */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:35;border-top:1px solid var(--line);background:linear-gradient(rgba(8,13,36,.9),rgba(6,10,28,.97));backdrop-filter:blur(10px);display:none}
#dock.on{display:block}
#dock .in{max-width:min(2200px,100%);margin:0 auto;padding:11px var(--pad);display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.cnt{display:inline-flex;align-items:center;gap:7px;font-size:14px;color:var(--vellum);white-space:nowrap}
.cnt b{font-weight:600;color:var(--white);font-size:16px;font-variant-numeric:tabular-nums}
.cnt.k b{color:#F4A98E}
.save{font-size:13.5px;color:var(--vellum);min-width:7ch}
.save.bad{color:var(--ant)}
.keys{display:flex;flex-wrap:wrap;gap:6px 11px;font-size:13px;color:var(--vellum)}
.keys .ar{gap:2px}
.keys span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.dockR{margin-left:auto;display:flex;align-items:center;gap:10px}
.lock{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--gold)}
.lock svg{width:14px;height:14px}
.final{border:1px solid rgba(243,238,223,.5);border-radius:999px;padding:6px 16px;color:var(--white)}

/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;z-index:60;display:none}
.ov.open{display:block}
.ov .scrim{position:absolute;inset:0;background:rgba(4,7,20,.8);opacity:0;transition:opacity .45s var(--ease)}
.ov.shown .scrim{opacity:1}

/* plate (lightbox) */
#plate .sheet{position:absolute;inset:0;overflow:auto;background:radial-gradient(100% 70% at 50% 0%,#101A42,#070C23 70%);opacity:0;transition:opacity .45s var(--ease)}
#plate.shown .sheet{opacity:1}
.ph{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:18px;padding:14px var(--pad);background:linear-gradient(rgba(7,12,35,.97),rgba(7,12,35,.9));border-bottom:1px solid var(--line)}
.ph .t{min-width:0}
.ph .eb{color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph h2{margin:2px 0 0;font:italic 400 clamp(26px,2.2vw,38px)/1.05 var(--serif)}
.ph .x{margin-left:auto;display:flex;gap:10px;align-items:center;flex:none}
.pbody{max-width:1640px;margin:0 auto;padding:22px calc(var(--pad) + 56px) 120px}
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,2vw,32px)}
.pfig{margin:0}
.pfig .frame{padding:10px}
.pfig .frame img,.pfig .frame .tempty{display:block;width:100%}
.pfig .cand{position:relative}
.pfig .cand::after{content:"";position:absolute;inset:4px;border:1px solid rgba(243,238,223,.2);pointer-events:none;transition:border-color .4s}
.pfig .cand.v-keep::after{border:2px solid var(--ald)}
.pfig .cand.v-reject img{filter:grayscale(.85) brightness(.55)}
.pfig .cand.v-reject::after{border-color:var(--ash)}
.pfig figcaption{display:flex;justify-content:space-between;gap:10px;margin-top:6px;color:var(--vellum)}
.pfig figcaption .sc{color:var(--white)}
.grades{display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,2vw,32px);margin-top:26px}
.gp{border-top:1px solid var(--line2);padding-top:12px}
.gph{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.gph .sc{color:var(--gold)}
.gph .v{display:flex;align-items:center;gap:8px;font:italic 22px var(--serif)}
.gph .v small{font:12.5px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--vellum)}
table.ft{width:100%;border-collapse:collapse;margin-top:10px;font-size:14.5px}
table.ft th{font-weight:400;text-align:left;color:var(--vellum);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;padding:4px 10px 6px 0;border-bottom:1px solid var(--line)}
table.ft td{padding:6px 10px 6px 0;border-bottom:1px dotted rgba(217,178,106,.2);vertical-align:top}
table.ft td:first-child{color:var(--vellum)}
.cr{display:inline-flex;align-items:center;gap:6px}
.cr svg{width:11px;height:11px;flex:none;overflow:visible}
.cr.c1{color:var(--white)}.cr.c5{color:var(--gold)}.cr.c0{color:var(--ant)}
.quote{margin:14px 0 0;font:italic 19px/1.45 var(--serif);color:var(--white)}
.small{font-size:13.5px;color:var(--vellum);margin-top:8px}
details.prompt{margin-top:24px;border-top:1px solid var(--line2);padding-top:10px}
details.prompt summary{cursor:pointer;color:var(--gold)}
details.prompt pre{white-space:pre-wrap;font:15px/1.6 var(--sans);color:var(--vellum);margin:10px 0 0;max-width:90ch}
.pfoot{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px var(--pad);border-top:1px solid var(--line);background:linear-gradient(rgba(8,13,36,.92),rgba(6,10,28,.98));backdrop-filter:blur(8px)}
.vword{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--vellum)}
.vword.k{color:#F4A98E}.vword.x{color:var(--ash)}
.btn.keep{border:1px solid var(--ald);color:var(--white);background:rgba(226,112,79,.14)}
.btn.keep:hover,.btn.keep.on{background:var(--ald);color:#1B0C06}
.btn.rej{border:1px solid var(--ash);color:var(--white)}
.btn.rej:hover,.btn.rej.on{background:var(--ash);color:var(--deep)}
.parrow{position:fixed;top:50%;z-index:4;width:48px;height:48px;margin-top:-24px;border-radius:50%;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;color:var(--gold);background:rgba(6,10,28,.7)}
.parrow:hover{background:rgba(217,178,106,.15)}
.parrow svg{width:20px;height:20px}
#pprev{left:calc(var(--pad) - 6px)}#pnext{right:calc(var(--pad) - 6px)}
.fly{position:fixed;z-index:70;pointer-events:none;object-fit:cover;transition:all .6s var(--ease)}

/* modal */
#confirm .panel{position:absolute;left:50%;top:50%;width:min(580px,calc(100vw - 28px));max-height:calc(100vh - 28px);overflow:auto;transform:translate(-50%,-46%);opacity:0;
  transition:opacity .4s var(--ease),transform .55s var(--ease);background:linear-gradient(#0E1739,#0A1230);border:1px solid var(--line2);box-shadow:0 40px 120px rgba(0,0,0,.6);padding:24px 26px}
#confirm.shown .panel{opacity:1;transform:translate(-50%,-50%)}
#confirm .eb{color:var(--gold)}
#confirm h2{margin:4px 0 16px;font:italic 400 32px/1.1 var(--serif)}
#confirm p{font-size:15px;line-height:1.55;color:#DCD7C8;margin:14px 0 0}
#confirm .acts{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;flex-wrap:wrap}
.rail{display:flex;height:14px;border-radius:2px;overflow:hidden;gap:2px}
.rail i{display:block;height:100%;min-width:3px;transition:flex-grow .5s var(--ease)}
.rail .kp{background:var(--ald)}
.rail .rj{background:var(--ash)}
.rail .ud{background:repeating-linear-gradient(135deg,var(--ash) 0 2px,transparent 2px 6px);box-shadow:inset 0 0 0 1px var(--ash)}
.rail .ne{background:rgba(243,238,223,.14);box-shadow:inset 0 0 0 1px rgba(243,238,223,.35)}
.rail .ap{background:var(--ald)}
.raill{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:9px;font-size:14px;color:var(--vellum)}
.raill b{color:var(--white);font-weight:600;font-variant-numeric:tabular-nums}
.raill i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-1px;margin-right:6px}
.raill .sw-k{background:var(--ald)}.raill .sw-r{background:var(--ash)}.raill .sw-u{background:repeating-linear-gradient(135deg,var(--ash) 0 2px,transparent 2px 5px);box-shadow:inset 0 0 0 1px var(--ash)}.raill .sw-n{box-shadow:inset 0 0 0 1px rgba(243,238,223,.5)}

/* document surface */
#doc .sheet{position:absolute;inset:0;overflow:auto;background:radial-gradient(120% 60% at 50% 0%,#121C44,#0A1230 60%,#080E27);opacity:0;transform:translateY(22px);transition:opacity .45s var(--ease),transform .7s var(--ease)}
#doc.shown .sheet{opacity:1;transform:none}
.din{max-width:1180px;margin:0 auto;padding:26px var(--pad) 120px}
.dhead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end;border-bottom:1px solid var(--line2);padding-bottom:18px}
.dhead .eb{color:var(--gold)}
.dhead h2{margin:6px 0 0;font:italic 400 clamp(44px,5vw,84px)/.98 var(--serif);text-wrap:balance}
.dhead .stl{margin-top:12px;display:flex;align-items:center;gap:9px;font-size:15px;color:var(--vellum)}
.dsec{display:grid;grid-template-columns:minmax(140px,210px) minmax(0,1fr);gap:clamp(14px,3vw,44px);padding:26px 0;border-bottom:1px solid rgba(217,178,106,.14)}
.dsec>h3{margin:0;color:var(--gold);font-weight:400}
.dsec p{margin:0;font-size:16px;line-height:1.65;color:#DCD7C8;max-width:72ch}
.rule{font:italic 400 clamp(22px,2vw,30px)/1.35 var(--serif)!important;color:var(--white)!important}
.hero{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px;margin-top:22px}
.hero .frame img{aspect-ratio:16/9;object-fit:cover}
.strip2{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;align-content:start}
.strip2 figure{margin:0}
.strip2 img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;border:1px solid var(--line)}
.strip2 figcaption{font-size:13px;color:var(--vellum);margin-top:4px}
.noimg{aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;border:1px dashed rgba(185,180,164,.35);color:var(--vellum);font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.noimg svg{width:44px;height:44px}
dl.obs{margin:0;display:grid;grid-template-columns:auto 1fr;gap:0}
dl.obs dt,dl.obs dd{margin:0;padding:8px 0;border-bottom:1px dotted rgba(217,178,106,.24);font-size:15.5px}
dl.obs dt{color:var(--vellum);padding-right:28px;text-transform:uppercase;letter-spacing:.14em;font-size:12.5px;padding-top:11px}
.neg{font-size:15px;color:var(--vellum)}
table.led{width:100%;border-collapse:collapse;font-size:14.5px;font-variant-numeric:tabular-nums}
table.led th{text-align:left;font-weight:400;color:var(--vellum);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;padding:0 12px 8px 0;border-bottom:1px solid var(--line2)}
table.led td{padding:8px 12px 8px 0;border-bottom:1px dotted rgba(217,178,106,.2)}
.stats{display:flex;flex-wrap:wrap;gap:10px 30px;font-size:14.5px;color:var(--vellum)}
.stats b{display:block;font:italic 400 32px/1 var(--serif);color:var(--white)}
ol.laws{margin:0;padding:0;list-style:none;counter-reset:l}
ol.laws li{counter-increment:l;position:relative;padding:10px 0 12px 58px;border-bottom:1px dotted rgba(217,178,106,.22);font-size:16.5px;line-height:1.55}
ol.laws li::before{content:counter(l,upper-roman);position:absolute;left:0;top:6px;font:italic 26px var(--serif);color:var(--gold)}
ul.trig{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
ul.trig li{font-size:16px;padding-left:22px;position:relative}
ul.trig li::before{content:"";position:absolute;left:3px;top:.55em;width:7px;height:7px;border-radius:50%;border:1px solid var(--gold)}
.dstep{display:flex;gap:10px;align-items:center}
.findings{font:15px/1.7 var(--sans);color:#DCD7C8;white-space:pre-wrap;margin:0}

/* dojo */
.imp{border:1px solid var(--line);background:rgba(18,28,68,.38);padding:18px 20px;border-radius:3px;position:relative;transition:border-color .3s,opacity .4s}
.imp+.imp{margin-top:18px}
.imp.focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(217,178,106,.14)}
.imp.v-approve{border-color:var(--ald)}
.imp.v-reject{opacity:.72}
.imph{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px}
.imph h3{margin:0;font:italic 400 26px/1.1 var(--serif)}
.imph .claim{margin:8px 0 0;font-size:16px;line-height:1.55;color:#DCD7C8;max-width:70ch}
.imph .std{margin-top:6px;font-size:13.5px;color:var(--vellum)}
.impr{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.impr .row{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.jch{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(185,180,164,.35);border-radius:3px;padding:1px 8px;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.jch.hi{border-color:rgba(243,238,223,.6)}
.jch.lo{border-color:var(--ant);color:#FFC6D3}
.jch.am{border-color:var(--gold);color:var(--gold)}
.vst{display:inline-flex;align-items:center;gap:5px;border-radius:2px;padding:1px 8px;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.vst.ap{background:var(--ald);color:#1B0C06}.vst.rj{border:1px solid var(--ash);color:var(--white)}
.pwall{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;margin-top:16px}
.duo{border:1px solid var(--line);background:rgba(6,10,28,.45);padding:10px;border-radius:2px}
.duoh{display:flex;justify-content:space-between;color:var(--vellum);font-size:13px;margin-bottom:7px}
.arms{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.arm{position:relative;border:1px solid rgba(243,238,223,.16);border-radius:2px;overflow:hidden;aspect-ratio:16/10;background:#050815}
.arm img{width:100%;height:100%;object-fit:cover;display:block}
.arm.pk{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.arm .al{position:absolute;left:5px;bottom:5px;background:rgba(6,10,28,.86);font-size:12px;padding:0 6px;line-height:19px;border-radius:2px;letter-spacing:.1em;text-transform:uppercase}
.arm .pkt{position:absolute;left:5px;top:5px;background:var(--gold);color:var(--night);font-size:12px;padding:0 6px;line-height:19px;border-radius:2px;font-weight:700;letter-spacing:.12em}
.arm .vid{position:absolute;right:5px;top:5px;background:rgba(6,10,28,.86);font-size:12px;padding:0 6px;line-height:19px;border-radius:2px}
.arm .culled{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--vellum);font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;background:repeating-linear-gradient(135deg,rgba(185,180,164,.05) 0 1px,transparent 1px 8px)}
.duo p{margin:8px 0 0;font-size:14px;line-height:1.5;color:#DCD7C8}
.duo p .j{color:var(--gold)}
.duo p .tie{color:var(--vellum)}
.duo p.dis{color:#F2D29B}
.kx{display:flex;gap:5px}
.kx button{min-width:30px;height:28px;border-radius:2px;font-size:13px;font-weight:700;border:1px solid rgba(243,238,223,.35);padding:0 8px}
.kx .k:hover,.kx .k.on{background:var(--ald);border-color:var(--ald);color:#1B0C06}
.kx .x:hover,.kx .x.on{background:var(--ash);border-color:var(--ash);color:var(--deep)}
.kx .u:hover{border-color:var(--white)}
.openb{color:var(--gold);font-size:13.5px;display:inline-flex;align-items:center;gap:6px;border-bottom:1px solid transparent}
.openb:hover{border-bottom-color:var(--gold)}

/* extract */
.xrow{border:1px solid var(--line);background:rgba(18,28,68,.38);border-radius:3px;padding:16px 18px}
.xrow+.xrow{margin-top:14px}
.xrow.focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(217,178,106,.14)}
.xrow.v-keep{border-color:var(--ald)}
.xrow.v-reject{opacity:.7}
.xcols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,.7fr);gap:18px;margin-top:14px}
.xcol .sc{color:var(--vellum);margin-bottom:7px}
.thumbs{display:flex;flex-wrap:wrap;gap:6px}
.thumbs img{width:112px;aspect-ratio:4/3;object-fit:cover;border:1px solid var(--line);display:block}
.rounds{display:flex;flex-direction:column;gap:6px}
.rounds div{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.wait{display:inline-flex;align-items:center;gap:8px;color:var(--vellum);font-size:13.5px}
.srcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}
.srcs figure{margin:0}
.srcs img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;border:1px solid var(--line)}
.srcs figcaption{font-size:13px;color:var(--vellum);margin-top:4px;overflow-wrap:anywhere}
.srcs figure.rd img{border-color:rgba(243,238,223,.5)}
.drop{border:1px dashed rgba(217,178,106,.45);border-radius:3px;padding:34px 20px;text-align:center;color:var(--vellum);cursor:pointer;transition:background .3s,border-color .3s}
.drop:hover,.drop.on{background:rgba(217,178,106,.07);border-color:var(--gold)}
.drop svg{width:58px;height:58px;display:block;margin:0 auto 10px;overflow:visible}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-top:16px;align-items:end}
.form label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--vellum)}
.form input{background:rgba(6,10,28,.6);border:1px solid var(--line2);border-radius:3px;color:var(--white);font:15px var(--sans);padding:8px 10px}
.form input:focus{outline:2px solid var(--gold);outline-offset:1px}
.prev{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;margin-top:14px}
.prev img{width:100%;aspect-ratio:1;object-fit:cover;border:1px solid var(--line)}

/* styles shelf */
.fams .item{grid-template-columns:1fr auto;padding:8px 12px}
.fams .item .id{font-size:15px}
.fams .item .n{color:var(--vellum);font-variant-numeric:tabular-nums}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(240px,20vw,340px),1fr));gap:18px}
.card{display:block;width:100%;text-align:left;border:1px solid var(--line);background:rgba(18,28,68,.4);border-radius:3px;overflow:hidden;transition:border-color .3s,transform .5s var(--ease)}
.card:hover,.card:focus-visible{border-color:var(--gold);transform:translateY(-2px)}
.card .im{position:relative;aspect-ratio:16/9;background:#050815;overflow:hidden}
.card .im img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s var(--ease)}
.card:hover .im img{transform:scale(1.03)}
.card .what{position:absolute;left:8px;top:8px;background:rgba(6,10,28,.86);font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:0 7px;line-height:20px;border-radius:2px}
.card .bd{display:flex;justify-content:space-between;gap:10px;padding:12px 14px 14px;align-items:flex-start}
.card h3{margin:0;font:italic 400 22px/1.15 var(--serif)}
.card .fm{font-size:13.5px;color:var(--vellum);margin-top:3px}
.stt{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(185,180,164,.45);border-radius:999px;padding:1px 10px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--vellum)}
.stt.proven{border-color:rgba(243,238,223,.7);color:var(--white)}
.card .noimg{aspect-ratio:auto;height:100%;border:0}

@media (max-width:1100px){
  .scene{grid-template-columns:minmax(0,1fr)}
  .src{position:static;display:grid;grid-template-columns:minmax(0,200px) 1fr;gap:14px}
  .xcols{grid-template-columns:1fr}
}
@media (max-width:860px){
  .two{grid-template-columns:minmax(0,1fr)}
  .side{position:static}
  .list{flex-direction:row;overflow-x:auto;padding-bottom:4px}
  .list li{flex:0 0 230px}
  .fams .list li{flex:0 0 auto}
  #head{grid-template-columns:1fr}
  #fornax{width:min(360px,100%)}
  .figcap{justify-content:flex-start}
  .pairs,.grades{grid-template-columns:1fr}
  .pbody{padding:18px var(--pad) 170px}
  .parrow{top:auto;bottom:86px;margin-top:0}
  .dsec{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr}
  .dhead{grid-template-columns:1fr}
  .tabkeys{display:none}
  .seglab{display:none}
  .brand svg.wm{display:none}
  .log{margin-left:0;flex-basis:100%;max-width:none}
}
@media (max-width:560px){
  #bar{gap:12px}
  .tag{display:none}
  .seg button{padding:5px 8px;font-size:12px;letter-spacing:.08em}
  .src{grid-template-columns:minmax(0,1fr)}
  #crumbs li:not(:first-child){display:none}
  #tabs{gap:13px}
  .tab{gap:7px}
  .tab .nm{font-size:17.5px}
  .tally{padding:0 7px}
  .tally.amber::before{display:none}
  .imph{grid-template-columns:1fr}
  .impr{align-items:flex-start}
  .impr .row{justify-content:flex-start}
  .pwall{grid-template-columns:1fr}
  #dock .in{gap:8px 14px}
  #dock .keys{display:none}
  .dockR{margin-left:0;width:100%;justify-content:space-between}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.2s!important;transition-delay:0s!important}
  #fornax .ln{stroke-dasharray:none;stroke-dashoffset:0}
  .fly{display:none}
}
</style>
</head>
<body>
<div id="sky" aria-hidden="true"></div>

<header id="bar">
  <a class="brand" id="brand" href="index.html" aria-label="Gravitone — back to the door"></a>
  <ol id="crumbs" class="sc" aria-label="Location"></ol>
  <div class="barR">
    <span class="sc seglab">Sample</span>
    <div class="seg sc" id="sample" role="group" aria-label="Sample data state">
      <button data-s="full">Full</button><button data-s="empty">Empty</button><button data-s="offline">Offline</button><button data-s="flaky">Flaky</button>
    </div>
    <span class="tag">Proposal</span>
  </div>
</header>

<main class="wrap">
  <section id="head">
    <div>
      <div class="sc eb">Almanac · working surface</div>
      <h1>Foundry</h1>
    </div>
    <div>
      <svg id="fornax" viewBox="0 0 440 150" role="img" aria-label="Fornax, the furnace — stylised figure; its four stars are the four modules"></svg>
      <div class="figcap sc"><span>Fornax · the furnace</span><span class="tag">stylised</span></div>
    </div>
  </section>
  <nav id="tabs" role="tablist" aria-label="Foundry modules"></nav>
  <section id="view" aria-live="polite"></section>
</main>

function stripHTML(r){

function frame(img,alt,extra){return '<div class="frame">'+'<i class="reg a"></i><i class="reg b"></i><i class="reg c"></i><i class="reg d"></i><img src="'+IMG+img+'" alt="'+esc(alt)+'" '+(extra||'')+'></div>';}
function sceneHTML(r,sc){

  h+='<div class="mx"><div class="grid" role="group" aria-label="Candidates, styles by mechanism" style="grid-template-columns:clamp(130px,11vw,180px) repeat('+cols.length+',minmax('+(cols.length>2?170:210)+'px,1fr))"><div></div>';
  cols.forEach(function(c){h+='<div class="colh"><div class="sc">'+c.m.id+'</div><div>'+c.m.label+(r.plan.seeds.length>1||true?' · seed '+c.seed:'')+'</div></div>';});

    ids.forEach(function(id){h+=tileHTML(r,findCand(id,r),ro);});
  });

function findCand(id,r){r=r||run();if(!r)return null;for(var i=0;i<r.candidates.length;i++)if(r.candidates[i].id===id)return r.candidates[i];return null;}
function cssId(id){return id.replace(/[^A-Za-z0-9_-]/g,'_');}
function tileHTML(r,c,ro){

  if(readyC(c)){
    h+='<img src="'+IMG+c.file+'" alt="" loading="lazy" draggable="false" data-open="'+c.id+'">';
    h+='<span class="occ"></span><svg class="ring" preserveAspectRatio="none" viewBox="0 0 100 100"><rect x="1" y="1" width="98" height="98" pathLength="1" vector-effect="non-scaling-stroke"/></svg><span class="fl"></span><span class="fl v"></span>';
  }else{
    h+=emptyTile(c);
  }

function emptyTile(c){

  return '<div class="tempty">'+glyph('undecided').replace('class="gl"','class="gl" style="width:24px;height:24px;opacity:.6"')+'<b>queued</b></div>';
}
function tileEl(id){return document.getElementById('cand-'+cssId(id));}
function refreshTile(id,fresh){
  var r=run(),c=findCand(id,r),el=tileEl(id);if(!el||!c)return;

  /* row buttons */
  var S=c.style;$$('.rk[data-row="'+S+'"]').forEach(function(b){
    var ids=r.candidates.filter(function(x){return x.style===S&&x.scene===c.scene&&readyC(x)}).map(function(x){return x.id});
    b.classList.toggle('on',ids.length>0&&ids.every(function(i){return r.verdicts[i]===b.getAttribute('data-v')}));});
  $$('.item[data-run="'+r.id+'"] .st').forEach(function(s){var n=counts(r);s.innerHTML=STATUS_WORD[r.status]+(LIVE.indexOf(r.status)>=0?' <b class="num">'+r.progress.done+'/'+r.progress.total+'</b>':'')+' · <b class="num">'+n.kept+'/'+r.candidates.length+'</b> kept';});
}
var saveT=null;
function setVerdict(ids,v){
  var r=run();if(!r||r.status==='committed')return;
  (Array.isArray(ids)?ids:[ids]).forEach(function(id){var c=findCand(id,r);if(!c||!readyC(c))return;if(v)r.verdicts[id]=v;else delete r.verdicts[id];refreshTile(id,true);});
  queueSave();
  renderDock();
  if(ST.plate)refreshPlateVerdict();
}
function queueSave(){
  ST.save='saving';paintSave();clearTimeout(saveT);
  saveT=setTimeout(function(){ST.save=SAMPLE==='flaky'?'error':'saved';paintSave();},400+260);
}
function paintSave(){var el=$('#save');if(!el)return;var r=run(),ro=r&&r.status==='committed';
  el.className='save'+(ST.save==='error'?' bad':'');

function setFocus(id,scroll){

function gridOrder(){var r=run();return r?r.candidates.map(function(c){return c.id}):[];}

/* ================================================================ PLATE (the comparison) */
var lastFocusEl=null;

    var a=fromEl.getBoundingClientRect(),fly=document.createElement('img');fly.src=IMG+c.file;fly.className='fly';
    fly.style.cssText='left:'+a.left+'px;top:'+a.top+'px;width:'+a.width+'px;height:'+a.height+'px;border-radius:2px';
    document.body.appendChild(fly);tgt.style.opacity=0;
    requestAnimationFrame(function(){var b=tgt.getBoundingClientRect();fly.style.left=b.left+'px';fly.style.top=b.top+'px';fly.style.width=b.width+'px';fly.style.height=b.height+'px';});

  }

}
function stepPlate(d){var o=gridOrder().filter(function(id){return readyC(findCand(id))});var i=o.indexOf(ST.plate);var n=o[Math.min(o.length-1,Math.max(0,i+d))];if(n&&n!==ST.plate){ST.plate=n;setFocus(n,true);renderPlate(true);crumbs();}}

/* ================================================================ CONFIRM (destructive) */
function openConfirm(kind){
  lastFocusEl=document.activeElement;ST.confirm=kind;ST.commitErr=null;ST.committing=false;
  var el=$('#confirm');el.classList.add('open');paintConfirm();void el.offsetWidth;el.classList.add('shown');
  setTimeout(function(){var b=$('#cno');if(b)b.focus();},50);
}
function closeConfirm(){if(!ST.confirm||ST.committing)return;ST.confirm=null;var el=$('#confirm');el.classList.remove('shown');setTimeout(function(){if(!ST.confirm)el.classList.remove('open')},REDUCED?0:400);if(lastFocusEl&&lastFocusEl.focus)lastFocusEl.focus({preventScroll:true});}
function paintConfirm(){
  var k=ST.confirm,h='';
  if(k==='cull'){var r=run(),n=counts(r);
    h='<div class="sc eb">'+r.id+'</div><h2 id="ctitle">Commit the cull?</h2>'+railHTML([[n.kept,'kp'],[n.rejected,'rj'],[n.undecided,'ud']])+
      '<div class="raill"><span><i class="sw-k"></i><b>'+n.kept+'</b> kept</span><span><i class="sw-r"></i><b>'+n.rejected+'</b> rejected</span><span><i class="sw-u"></i><b>'+n.undecided+'</b> undecided</span></div>'+
      '<p>Everything not kept is deleted from disk. Every decided candidate is written to <code>pipeline/foundry/ledger.json</code> and the style catalogue. This cannot be undone.</p>'+
      (ST.commitErr?'<div class="errbox" role="alert" style="margin-top:14px"><b>The commit failed and nothing was deleted:</b> '+esc(ST.commitErr)+'</div>':'')+
      '<div class="acts"><button class="btn ghost" id="cno"'+(ST.committing?' disabled':'')+'>Not yet</button><button class="btn danger" id="cyes"'+(ST.committing?' disabled':'')+'>'+(ST.committing?'committing…':'Delete '+(n.rejected+n.undecided)+', keep '+n.kept)+'</button></div>';
  }else if(k==='extract'){var x=xrun(),xc=xCounts(x);
    h='<div class="sc eb">'+x.id+'</div><h2 id="ctitle">Commit the kept styles?</h2>'+railHTML([[xc.kept,'kp'],[xc.rejected,'rj'],[xc.undecided,'ud']])+
      '<div class="raill"><span><i class="sw-k"></i><b>'+xc.kept+'</b> kept</span><span><i class="sw-r"></i><b>'+xc.rejected+'</b> thrown</span><span><i class="sw-u"></i><b>'+xc.undecided+'</b> undecided</span></div>'+
      '<p>The kept styles join <code>pipeline/foundry/styles.json</code> as candidates, with their sources, best replicas and transfers as exemplars. Nothing is deleted, but the verdicts are final.</p>'+
      '<div class="acts"><button class="btn ghost" id="cno">Not yet</button><button class="btn gold" id="cyes">Commit '+xc.kept+', reject '+(xc.rejected+xc.undecided)+'</button></div>';
  }else if(k==='dojo'){var cy=cycle(),dc=dCounts(cy);
    h='<div class="sc eb">'+cy.id+'</div><h2 id="ctitle">Commit the gate?</h2>'+railHTML([[dc.approved,'ap'],[dc.rejected,'rj'],[dc.undecided,'ne']])+
      '<div class="raill"><span><i class="sw-k"></i><b>'+dc.approved+'</b> approved</span><span><i class="sw-r"></i><b>'+dc.rejected+'</b> rejected</span><span><i class="sw-n"></i><b>'+dc.undecided+'</b> untouched</span></div>'+
      '<p>Every decided improvement’s media — both arms of every pair, posters included — is deleted from this machine. One thumbnail per approved improvement is copied into git, and one row per decided improvement joins <code>pipeline/foundry/training-ledger.json</code>. This cannot be undone.</p>'+
      (ST.commitErr?'<div class="errbox" role="alert" style="margin-top:14px"><b>The commit failed and nothing was deleted:</b> '+esc(ST.commitErr)+'</div>':'')+
      '<div class="acts"><button class="btn ghost" id="cno"'+(ST.committing?' disabled':'')+'>Not yet</button><button class="btn danger" id="cyes"'+(ST.committing?' disabled':'')+'>'+(ST.committing?'committing…':'Commit '+dc.decided+' decided')+'</button></div>';
  }
  $('#cpanel').innerHTML=h;
  $('#cno').addEventListener('click',closeConfirm);
  $('#cyes').addEventListener('click',doCommit);
}
function railHTML(segs){var t=segs.reduce(function(a,s){return a+s[0]},0)||1;return '<div class="rail" role="img" aria-label="'+segs.map(function(s){return s[0]}).join(', ')+'">'+segs.filter(function(s){return s[0]>0}).map(function(s){return '<i class="'+s[1]+'" style="flex-grow:'+s[0]+'"></i>';}).join('')+'</div>';}
function doCommit(){
  var k=ST.confirm;ST.committing=true;ST.commitErr=null;paintConfirm();
  setTimeout(function(){
    if(SAMPLE==='flaky'&&ST.flakyCommit++===0){ST.committing=false;ST.commitErr='HTTP 409 — forge.py holds the run lock (pid 18244); nothing was touched.';paintConfirm();return;}
    ST.committing=false;
    if(k==='cull'){var r=run(),kept=0,del=0;
      r.candidates.forEach(function(c){if(!readyC(c))return;if(r.verdicts[c.id]==='keep')kept++;else{c.deleted=true;r.verdicts[c.id]='reject';del++;}});
      ST.result={run:r.id,kept:kept,deleted:del,findings:findingsFor(r)};r.status='committed';r.committed={kept:kept,deleted:del};
      /* the catalogue learns */
      r.candidates.forEach(function(c){if(c.grade)LEDGER.unshift({run:r.id,scene:c.scene,style:c.style,mechanism:c.mechanism,seed:c.seed,verdict:r.verdicts[c.id]==='keep'?'keep':'reject',craft:c.grade.craft.score,style_score:c.grade.style?c.grade.style.score:null,file:c.file});});
    }else if(k==='extract'){var x=xrun();x.status='committed';x.styles.forEach(function(s){if(!x.verdicts[s.id])x.verdicts[s.id]='reject';});}
    else if(k==='dojo'){var cy=cycle(),dc=dCounts(cy);cy.status='committed';cy.result={deleted:0,thumbs:dc.approved,ledger_rows:dc.decided};
      cy.improvements.forEach(function(im){if(cy.verdicts[im.id]){cy.result.deleted+=im.pairs.length*2;im.pairs.forEach(function(p){p.baseline.deleted=p.challenger.deleted=true;});}});}
    ST.confirm=null;var el=$('#confirm');el.classList.remove('shown');setTimeout(function(){el.classList.remove('open')},REDUCED?0:400);
    ST.focus=null;render();
  },900);
}
function findingsFor(r){
  var sty=r.plan.styles,mech=r.plan.mechanisms.map(function(m){return m.id});
  var L=['# '+r.id+' — findings','','kept '+counts(r).kept+' of '+counts(r).total+' decided candidates.',''];
  L.push('## by row — styles');
  sty.forEach(function(s){var cs=r.candidates.filter(function(c){return c.style===s&&c.grade});var k=cs.filter(function(c){return r.verdicts[c.id]==='keep'}).length;
    L.push('- '+STY[s].name+': held on '+k+'/'+cs.length+(k===cs.length&&cs.length?' — holds on every mechanism':k===0?' — failed every mechanism on this scene':''));});
  L.push('','## by column — mechanisms');
  mech.forEach(function(m){var cs=r.candidates.filter(function(c){return c.mechanism===m&&c.grade});var k=cs.filter(function(c){return r.verdicts[c.id]==='keep'}).length;
    L.push('- '+m+': '+k+'/'+cs.length+(k===0&&cs.length?' — a bad lane, not '+cs.length+' bad styles':''));});
  L.push('','## grader vs human');
  var dis=r.candidates.filter(function(c){return c.grade&&c.grade.style&&((c.grade.style.score>=.75)!==(r.verdicts[c.id]==='keep'))});
  L.push(dis.length?'- the grader and the cull disagreed on '+dis.length+': '+dis.map(function(c){return STY[c.style].name+' · '+c.mechanism}).join(', '):'- no disagreements');
  L.push('','written to pipeline/foundry/ledger.json and pipeline/foundry/styles.json');
  return L.join('\n');
}

/* ================================================================ DOCUMENT SURFACE */
function openDoc(d){
  lastFocusEl=lastFocusEl&&ST.doc?lastFocusEl:document.activeElement;ST.doc=d;
  var el=$('#doc');el.classList.add('open');paintDoc();void el.offsetWidth;el.classList.add('shown');crumbs();
  $('#dsheet').scrollTop=0;
  setTimeout(function(){var b=$('#dclose');if(b)b.focus({preventScroll:true});},60);
}
function closeDoc(){if(!ST.doc)return;ST.doc=null;var el=$('#doc');el.classList.remove('shown');setTimeout(function(){if(!ST.doc)el.classList.remove('open')},REDUCED?0:450);crumbs();
  if(lastFocusEl&&lastFocusEl.focus&&document.body.contains(lastFocusEl))lastFocusEl.focus({preventScroll:true});lastFocusEl=null;}
function paintDoc(){
  var d=ST.doc,h='<div class="ph"><div class="t"><div class="sc eb">'+esc(d.eyebrow)+'</div></div><div class="x">'+(d.step?'<div class="dstep"><button class="btn ghost sm" id="dprev" aria-label="Previous">‹</button><button class="btn ghost sm" id="dnext" aria-label="Next">›</button></div>':'')+'<button class="btn ghost sm" id="dclose">'+esc(d.back)+' <kbd>Esc</kbd></button></div></div>';

}
function styleDoc(id){
  var list=visibleStyles(),S=STY[id];
  var kept=LEDGER.filter(function(r){return r.style===id&&r.verdict==='keep'}),rows=LEDGER.filter(function(r){return r.style===id});

  var scenes={};kept.forEach(function(r){scenes[r.run+'/'+r.scene]=1});
  var hero=heroOf(id);
  return {title:S.name,eyebrow:'style · '+S.family+' · '+S.origin.kind+(S.origin.source?' from '+S.origin.source:''),back:'Styles',
    step:function(dd){var i=list.indexOf(id),n=list[(i+dd+list.length)%list.length];ST.doc=styleDoc(n);paintDoc();crumbs();$('#dsheet').scrollTop=0;},
    html:function(){
      var h='<div class="dhead"><div><h2 id="dtitle">'+S.name+'</h2><div class="stl">'+glyph(S.status==='proven'?'committed':'undecided')+(S.status==='proven'?'proven — a human kept it on more than one scene':'candidate — awaiting kept work on a second scene')+'</div></div><span class="stt '+S.status+'">'+S.status+'</span></div>';
      var imgs=[];kept.forEach(function(r){var f=r.file||(S.hero&&S.hero[1]==='kept render'?S.hero[0]:null);if(f&&imgs.every(function(x){return x.f!==f}))imgs.push({f:f,cap:'kept · '+r.run+' · '+r.scene+' · '+r.mechanism});});
      if(S.hero&&imgs.every(function(x){return x.f!==S.hero[0]}))imgs.push({f:S.hero[0],cap:S.hero[1]+' · '+(S.origin.source||'house')});
      h+='<div class="hero">'+(hero?frame(hero.f,S.name+' — '+hero.what):'<div class="noimg">'+glyph('undecided').replace('class="gl"','class="gl" style="width:44px;height:44px"')+'no render yet</div>')+
        '<div class="strip2">'+imgs.slice(hero?1:0).map(function(x){return '<figure><img src="'+IMG+x.f+'" alt="'+esc(S.name+' — '+x.cap)+'" loading="lazy"><figcaption>'+esc(x.cap)+'</figcaption></figure>';}).join('')+
        '<div class="stats" style="grid-column:1/-1;margin-top:6px"><span><b>'+kept.length+'</b>kept of '+rows.length+' decided</span><span><b>'+pct(avg(rows.map(function(r){return r.craft})))+'</b>craft</span><span><b>'+pct(avg(rows.map(function(r){return r.style_score})))+'</b>style</span><span><b>'+Object.keys(scenes).length+'</b>scenes</span></div></div></div>';
      h+='<section class="dsec"><h3 class="sc">Recipe</h3><p class="rule">'+esc(S.recipe)+'</p></section>';
      h+='<section class="dsec"><h3 class="sc">Observables</h3><dl class="obs">'+STYLE_F.map(function(f){return '<dt>'+f.replace(/_/g,' ')+'</dt><dd>'+esc(S.obs[f])+'</dd>';}).join('')+'</dl></section>';
      h+='<section class="dsec"><h3 class="sc">Negative</h3><p class="neg">'+esc(S.negative)+'</p></section>';
      h+='<section class="dsec" style="border-bottom:0"><h3 class="sc">Evidence</h3><div style="overflow-x:auto">'+(rows.length?'<table class="led"><thead><tr><th>run</th><th>scene</th><th>mechanism</th><th>seed</th><th>verdict</th><th>craft</th><th>style</th></tr></thead><tbody>'+
        rows.map(function(r){return '<tr><td>'+r.run+'</td><td>'+r.scene+'</td><td>'+r.mechanism+'</td><td>'+r.seed+'</td><td>'+(r.verdict==='keep'?'<span class="cr" style="color:#F4A98E">'+glyph('keep')+'kept</span>':'<span class="cr muted">'+glyph('reject')+'rejected</span>')+'</td><td>'+pct(r.craft)+'</td><td>'+pct(r.style_score)+'</td></tr>';}).join('')+'</tbody></table>':'<p class="muted" style="font-size:15px">no ledger rows</p>')+'</div></section>';
      return h;}};
}

function findingsDoc(){var r=ST.result;return {title:'findings.md',eyebrow:r.run+' · committed',back:r.run,

function closeAll(){if(ST.confirm)closeConfirm();if(ST.doc)closeDoc();if(ST.plate)closePlate();}

/* ================================================================ STYLES */
function familyOf(id){return STY[id].family;}
function heroOf(id){var S=STY[id];var k=LEDGER.filter(function(r){return r.style===id&&r.verdict==='keep'&&r.file})[0];if(k)return {f:k.file,what:'kept render'};return S.hero?{f:S.hero[0],what:S.hero[1]}:null;}
function visibleStyles(){return (ST.styles||[]).filter(function(s){return ST.family==='all'||familyOf(s)===ST.family;});}
function stylesHTML(){
  var h='<div class="two"><nav class="side fams" aria-label="Style families"><div class="sideh sc"><span>Families</span></div>';
  if(ST.stErr)h+=listErr(ST.stErr,'retry');
  if(ST.styles){
    var fc={};ST.styles.forEach(function(s){fc[familyOf(s)]=(fc[familyOf(s)]||0)+1;});
    var fl=[['all',ST.styles.length]].concat(Object.keys(fc).map(function(k){return [k,fc[k]]}).sort(function(a,b){return b[1]-a[1]||a[0].localeCompare(b[0])}));
    h+='<ul class="list">'+fl.map(function(f){return '<li><button class="item" data-fam="'+f[0]+'" aria-pressed="'+(ST.family===f[0])+'" aria-current="'+(ST.family===f[0])+'"><span class="id">'+f[0]+'</span><span class="n num">'+f[1]+'</span></button></li>';}).join('')+'</ul>';
  }
  h+='</nav><div>';
  if(ST.styles){var vs=visibleStyles();
    if(!vs.length)h+='<div class="ghost-rows" aria-hidden="true" style="display:grid;grid-template-columns:repeat(3,1fr);gap:18px"><i style="height:220px"></i><i style="height:220px"></i><i style="height:220px"></i></div><div class="ghostlab sc">no styles yet</div>';
    h+='<div class="cards">'+vs.map(function(id){var S=STY[id],hero=heroOf(id),k=LEDGER.filter(function(r){return r.style===id&&r.verdict==='keep'}).length;
      return '<button class="card" data-style="'+id+'" aria-label="Open '+S.name+'"><div class="im">'+(hero?'<img src="'+IMG+hero.f+'" alt="" loading="lazy"><span class="what">'+hero.what+'</span>':'<div class="noimg">'+glyph('undecided').replace('class="gl"','class="gl" style="width:30px;height:30px"')+'no render yet</div>')+'</div>'+
        '<div class="bd"><div style="min-width:0"><h3>'+S.name+'</h3><div class="fm">'+S.family+' · '+S.origin.kind+(k?' · '+k+' kept':'')+'</div></div><span class="stt '+S.status+'">'+S.status+'</span></div></button>';}).join('')+'</div>';
  }
  return h+'</div></div>';
}

/* ================================================================ EXTRACT */
function xCounts(x){var ids=x.styles.map(function(s){return s.id});var k=ids.filter(function(i){return x.verdicts[i]==='keep'}).length,r=ids.filter(function(i){return x.verdicts[i]==='reject'}).length;return {total:ids.length,kept:k,rejected:r,undecided:ids.length-k-r};}
function extractHTML(){
  var h='<div class="two"><aside class="side"><button class="item" data-xnew aria-current="'+(ST.xsel===null&&!!ST.xruns)+'" style="grid-template-columns:1fr"><span class="id">+ new extraction</span></button><div class="sideh sc" style="margin-top:14px"><span>Runs</span></div>';
  if(ST.xErr)h+=listErr(ST.xErr,'retry');
  if(ST.xruns&&!ST.xruns.length)h+='<div class="ghost-rows" aria-hidden="true"><i></i><i></i></div><div class="ghostlab sc">no extractions yet</div>';
  if(ST.xruns)h+='<ul class="list">'+ST.xruns.map(function(r){var live=X_LIVE.indexOf(r.status)>=0,c=xCounts(r);
    return '<li><button class="item" data-xrun="'+r.id+'" aria-current="'+(r.id===ST.xsel)+'">'+glyph(runGlyph(r.status))+'<span class="id">'+r.id+'</span><span class="st">'+X_WORD[r.status]+(live?' <b class="num">'+r.progress.done+'/'+r.progress.total+'</b>':'')+' · '+r.sources.length+' src · '+r.styles.length+' styles · <b>'+c.kept+'</b> kept</span></button></li>';}).join('')+'</ul>';
  h+='</aside><div>';
  var x=xrun();
  if(ST.xruns&&(ST.xsel===null||!x))h+=newRunHTML();
  else if(x){
    var live=X_LIVE.indexOf(x.status)>=0,last=x.log[x.log.length-1],p=Math.round(100*x.progress.done/x.progress.total);
    h+='<div class="strip"><span class="pill '+pillCls(x.status)+'">'+glyph(runGlyph(x.status))+X_WORD[x.status]+(live?' '+x.progress.done+'/'+x.progress.total:'')+'</span><span class="facts"><b>'+plural(x.sources.length,'source')+'</b> · <b>'+plural(x.styles.length,'style')+'</b> · '+x.options.replicas+'×'+x.options.rounds+' rounds · '+plural(x.options.transfers,'transfer')+'</span>'+
      '<span class="facts">eyes <b>'+x.engines.vision+'</b> · pixels <b>'+x.engines.generator+'</b> · words <b>'+x.engines.reasoner+'</b></span>';
    if(live)h+='<span style="margin-left:auto;display:flex;gap:10px;align-items:center">'+(ST.driveErr?'<span class="err" role="alert">'+esc(ST.driveErr)+'</span>':'')+(ST.driving?'<button class="btn ghost sm" data-act="pause">pause</button>':'<button class="btn gold sm" data-act="drive">'+(ST.driveErr?'retry':x.progress.done?'resume':'start')+'</button>')+'</span>'+
      '<div class="meridian" aria-hidden="true"><i style="width:'+p+'%"></i></div>'+(last?'<span class="log" style="margin-left:0">'+esc(last.msg)+'</span>':'');
    h+='</div>';
    if(x.status==='committed'&&x.committed)h+='<div class="report">'+glyph('committed')+'<span class="sc">committed · '+x.committed.written.join(', ')+' → pipeline/foundry/styles.json · '+x.committed.rejected.length+' rejected</span></div>';
    h+='<div class="sc muted" style="margin-top:20px">sources '+x.sources.filter(function(s){return s.readback}).length+'/'+x.sources.length+' read</div><div class="srcs">'+x.sources.map(function(s){return '<figure class="'+(s.readback?'rd':'')+'"><img src="'+IMG+s.name+'" alt="source '+s.id+'" loading="lazy"><figcaption>'+s.id+' · '+s.name.replace(/\.[a-z]+$/,'')+'</figcaption></figure>';}).join('')+'</div>';
    h+='<div style="margin-top:22px">'+x.styles.map(function(st){return xRowHTML(x,st)}).join('')+'</div>';
  }
  return h+'</div></div>';
}
function xRowHTML(x,st){
  var v=x.verdicts[st.id],ro=x.status==='committed',byId={};x.sources.forEach(function(s){byId[s.id]=s});

/* ================================================================ keyboard */
function trap(e,root){var f=$$('button:not([disabled]),a[href],input,summary,[tabindex="0"]',root).filter(function(x){return x.offsetParent!==null||x===document.activeElement});
  if(!f.length)return;var i=f.indexOf(document.activeElement);
  if(e.shiftKey&&i<=0){f[f.length-1].focus();e.preventDefault();}else if(!e.shiftKey&&(i===f.length-1||i<0)){f[0].focus();e.preventDefault();}}
document.addEventListener('keydown',function(e){
  var t=e.target,typing=t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable);
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(ST.confirm){if(e.key==='Escape'){e.preventDefault();closeConfirm();}else if(e.key==='Tab')trap(e,$('#confirm'));return;}
  if(ST.doc){
    if(e.key==='Escape'){e.preventDefault();closeDoc();return;}
    if(e.key==='Tab'){trap(e,$('#doc'));return;}
    if(ST.doc.step&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){e.preventDefault();ST.doc.step(e.key==='ArrowLeft'?-1:1);return;}
    var cy=cycle();if(ST.tab==='dojo'&&cy&&GATEABLE.indexOf(cy.status)>=0&&ST.cfocus){var k=e.key.toLowerCase();if(k==='k'||k==='x'||k==='u'){setDVerdict(ST.cfocus,k==='k'?'approve':k==='x'?'reject':null);paintDoc();}}
    return;}
  if(ST.plate){
    var r=run(),ro=r.status==='committed',k2=e.key.toLowerCase();
    if(e.key==='Escape'){e.preventDefault();closePlate();}
    else if(e.key==='ArrowRight'){e.preventDefault();stepPlate(1);}
    else if(e.key==='ArrowLeft'){e.preventDefault();stepPlate(-1);}
    else if(!ro&&k2==='k')setVerdict(ST.plate,'keep');
    else if(!ro&&k2==='x')setVerdict(ST.plate,'reject');
    else if(!ro&&k2==='u')setVerdict(ST.plate,null);
    else if(e.key==='Tab')trap(e,$('#plate'));
    return;}
  if(typing)return;
  if(['1','2','3','4'].indexOf(e.key)>=0){setTab(TABS[+e.key-1].id);e.preventDefault();return;}
  var key=e.key.toLowerCase(),onButton=t&&(t.tagName==='BUTTON'||t.tagName==='A'||t.tagName==='SUMMARY');
  if(ST.tab==='cull'&&run()){
    var o=gridOrder(),i=ST.focus?o.indexOf(ST.focus):-1,cols=gridCols(),ro2=run().status==='committed';
    var step=function(d){var n=Math.min(o.length-1,Math.max(0,(i<0?0:i)+d));setFocus(o[n]);};
    if(e.key==='ArrowRight'){e.preventDefault();step(i<0?0:1);}
    else if(e.key==='ArrowLeft'){e.preventDefault();step(i<0?0:-1);}
    else if(e.key==='ArrowDown'){e.preventDefault();step(i<0?0:cols);}
    else if(e.key==='ArrowUp'){e.preventDefault();step(i<0?0:-cols);}
    else if(key==='k'&&ST.focus&&!ro2)setVerdict(ST.focus,'keep');
    else if(key==='x'&&ST.focus&&!ro2)setVerdict(ST.focus,'reject');
    else if(key==='u'&&ST.focus&&!ro2)setVerdict(ST.focus,null);
    else if(e.key==='Enter'&&ST.focus&&!onButton){e.preventDefault();openPlate(ST.focus,tileEl(ST.focus));}
  }else if(ST.tab==='dojo'&&cycle()){
    var cy2=cycle(),L=cy2.improvements.map(function(x){return x.id}),j=ST.cfocus?L.indexOf(ST.cfocus):-1,gate=GATEABLE.indexOf(cy2.status)>=0;
    var mv=function(d){var n=L[Math.min(L.length-1,Math.max(0,(j<0?0:j+d)))];ST.cfocus=n;$$('.imp').forEach(function(q){q.classList.toggle('focus',q.getAttribute('data-imp')===n)});var el=document.getElementById('imp-'+n);if(el){el.focus({preventScroll:true});el.scrollIntoView({block:'nearest',behavior:REDUCED?'auto':'smooth'});}};
    if(e.key==='ArrowDown'||e.key==='ArrowRight'){e.preventDefault();mv(1);}
    else if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();mv(-1);}
    else if(gate&&ST.cfocus&&(key==='k'||key==='x'||key==='u'))setDVerdict(ST.cfocus,key==='k'?'approve':key==='x'?'reject':null);
    else if(e.key==='Enter'&&ST.cfocus&&!onButton){e.preventDefault();var im=cy2.improvements.filter(function(x){return x.id===ST.cfocus})[0];openDoc(techDoc(cy2,im));}
  }else if(ST.tab==='extract'&&xrun()){
    var x=xrun(),XL=x.styles.map(function(s){return s.id}),xi=ST.xfocus?XL.indexOf(ST.xfocus):-1,xro=x.status==='committed';
    var xm=function(d){var n=XL[Math.min(XL.length-1,Math.max(0,(xi<0?0:xi+d)))];ST.xfocus=n;$$('.xrow').forEach(function(q){q.classList.toggle('focus',q.getAttribute('data-xs')===n)});var el=document.getElementById('xs-'+n);if(el)el.scrollIntoView({block:'nearest',behavior:REDUCED?'auto':'smooth'});};
    if(e.key==='ArrowDown'){e.preventDefault();xm(1);}else if(e.key==='ArrowUp'){e.preventDefault();xm(-1);}
    else if(!xro&&ST.xfocus&&(key==='k'||key==='x'||key==='u'))setXVerdict(ST.xfocus,key==='k'?'keep':key==='x'?'reject':null);
  }
});

  if(!ST.runs)return;var r=ST.runs.filter(function(x){return x.status==='generating'})[0];if(!r)return;
  var c=r.candidates.filter(function(x){return x.status==='generating'})[0];if(!c)return;
  if(c.step<30){c.step++;}
  var msg=c.step<30?c.id+' · denoise '+c.step+'/30':c.id+' · decoding';
  r.log[r.log.length-1]={msg:msg};
  if(ST.tab==='cull'&&ST.sel===r.id){var l=$('#runlog');if(l)l.textContent=msg;var s=document.querySelector('[data-step="'+c.id+'"]');if(s)s.textContent=c.step<30?'denoise '+c.step+'/30':'decoding';var b=document.querySelector('[data-stepbar="'+c.id+'"]');if(b)b.style.width=(100*c.step/30)+'%';
    var rb=$('#runbar');if(rb)rb.style.width=(100*(r.progress.done+c.step/30)/r.progress.total)+'%';}
},REDUCED?4000:2400);

/* ================================================================ boot */
$$('#sample button').forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-s')===SAMPLE);
  b.addEventListener('click',function(){var s=b.getAttribute('data-s');location.search=s==='full'?'':'?sample='+s;});});
var qtab=new URLSearchParams(location.search).get('tab');if(TABS.some(function(t){return t.id===qtab}))ST.tab=qtab;
loadAll();
render();
requestAnimationFrame(function(){requestAnimationFrame(function(){document.body.classList.add('lit')})});
})();
</script>
</body>
</html>
