<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gravitone · Floor</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="floor.css">
</head>
<body>
<header data-component="StudioHeader" id="hdr"></header>
<main data-component="Floor" id="floor" aria-label="Studio floor"></main>
<section id="month" data-component="MonthCalendar" aria-label="Calendar month" hidden></section>
<div class="scrim" id="scrim"></div>
<section data-component="LevelSheet" id="sheet" role="dialog" aria-modal="true" aria-label="Level" aria-hidden="true"></section>
<div class="toast" id="toast" role="status"></div>
<div id="live" class="sr-only" aria-live="polite"></div>
<audio id="player" preload="none"></audio>

<script src="../data/gravitone.js"></script>
<script src="fixtures.js"></script>
<script src="model.js"></script>
<script src="shell.js"></script>
<script>
(function () {
"use strict";
const M = window.GT_MODEL;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const RM = window.matchMedia("(prefers-reduced-motion: reduce)");
const reduced = () => RM.matches;
const titleCase = (id) => String(id).replace(/-/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());
const wait = (ms) => new Promise((r) => setTimeout(r, reduced() ? 0 : ms));
const fmt = M.fmt;

const I = GT.I;
const MODE_ICON = { "matrix-cull": I.cull, "blind-pair": I.pair, "packet-review": I.review };
const MODE_NAME = { "matrix-cull": "Matrix Cull", "blind-pair": "Blind Pair", "packet-review": "Packet Review" };

/* ───────────── signal vocabulary (render fns) ───────────── */
const { Tally, StackBar, PipRow, Hint, Keycaps, Wave } = GT;
const CALIB = `<span class="chip rose" title="">craft AUC ${M.calibration.craft.auc} · inverted · hidden</span><span class="chip amber">style_score ${M.calibration.style_score.auc} · chance · hidden</span>`;

/* ───────────── lanes & state ───────────── */
const LANES = [
  { id: "image", n: 1, name: "Image", shelfName: "Library · styles" },
  { id: "article", n: 2, name: "Article", shelfName: "Library · posts" },
  { id: "audio", n: 3, name: "Audio", shelfName: "Library · kept takes" },
  { id: "video", n: 4, name: "Video", shelfName: "Projects" },
];
const laneById = Object.fromEntries(LANES.map((l) => [l.id, l]));
const ARTICLE_STAGES = M.ARTICLE_STAGES;
const forgeCands = M.media.filter((m) => m.kind === "forge.candidate");
const stripPosters = M.media.filter((m) => m.kind === "strip.poster");
const stripVideos = M.media.filter((m) => m.kind === "strip.video");
const forgeStyles = [...new Set(forgeCands.map((c) => c.style))];

const S = {
  focus: null, level: null, spot: null, zoom: false,
  cal: false, calMonth: { y: 2026, m: 9 }, calDay: null, calChanOff: {},
  packets: M.packets,
  runs: [],
  shelf: M.styles.filter((s) => s.shelf).map((s) => ({ id: s.id, name: s.name, hero: s.hero, family: s.family, src: "proven" })),
  motion: [], pins: [], posts: [],
  kept: M.keptTakes.slice().sort((a, b) => (a.kind === b.kind ? 0 : a.kind === "music" ? -1 : 1)),
  projects: M.projects.map((p) => ({ ...p, steps: p.steps.map((s) => ({ ...s })) })),
  slots: M.slots.map((s) => ({ ...s })),
  cull: {}, pair: {}, review: {}, cut: {},
  spend: { lo: 0, hi: 0 },
  seq: 0, playing: null,
  comp: {
    image: { text: "", style: "teal-orange-blockbuster", mechs: { text: true, "ref-early": true } },
    article: { text: "", topic: "agent-run-budgeting" },
    audio: { text: "", kind: "music" },
    video: { text: "", subject: "edu-radar" },
  },
};
S.packets.forEach((p) => { p.lane = p.media; });
// running work already in the model
M.runs.filter((r) => r.status === "running").forEach((r) => {
  S.runs.push({ id: r.id, lane: r.lane === "articles" ? "article" : r.lane, title: r.title, status: "running", model: true, stage: r.stage, progress: r.progress, queue: r.queue, engine: r.engine, costNote: r.costNote, costRange: r.costRange });
});

const awaiting = (lane) => S.packets.filter((p) => p.status === "awaiting_gate" && (!lane || p.lane === lane));
const nextPacket = () => { for (const l of LANES) { const a = awaiting(l.id); if (a.length) return a[0]; } return null; };
const styleName = (id) => (M.styleById[id] && M.styleById[id].name) || titleCase(id);

/* ───────────── per-packet decision state ───────────── */
function flatItems(p) { const out = []; (p.rows || []).forEach((r) => r.items.forEach((it) => out.push({ ...it, row: r.key }))); return out; }
function cullState(p) {
  if (!S.cull[p.id]) { const items = flatItems(p); S.cull[p.id] = { items, marks: items.map(() => null), cur: 0, hist: [], spawn: {} }; }
  return S.cull[p.id];
}
function pairState(p) { return S.pair[p.id] || (S.pair[p.id] = { i: 0, picks: [], revealed: false }); }
function reviewState(p) { return S.review[p.id] || (S.review[p.id] = { focus: 0, notes: [], editing: null, dir: "more_weight" }); }
function tallyOf(p) {
  if (p.deskMode === "matrix-cull") { const c = S.cull[p.id]; if (!c) return { k: 0, x: 0, u: p.count }; let k = 0, x = 0; c.marks.forEach((m) => { if (m && m.v === "keep") k++; else if (m && m.v === "reject") x++; }); return { k, x, u: c.items.length - k - x }; }
  if (p.deskMode === "blind-pair") { const c = S.pair[p.id]; const n = c ? c.picks.length : 0; const bad = c ? c.picks.filter((q) => q.pick === "bad").length : 0; return { k: n - bad, x: bad, u: p.count - n }; }
  return { k: 0, x: 0, u: 1 };
}

/* ───────────── header ───────────── */
function renderHeader() {
  const nx = nextPacket();
  const cur = S.cal ? "calendar" : S.level ? (S.level.kind === "board" ? "board" : "floor") : "floor";
  const spend = S.spend.hi ? `$${S.spend.lo}–${S.spend.hi}` : "$0.00";
  $("#hdr").innerHTML = GT.header({ current: cur, awaiting: awaiting().length, next: nx, spend });
}
function mirrorPulse() {
  const m = $("#mirror"); if (!m) return;
  m.classList.add("writing"); m.innerHTML = '<span class="dot"></span>mirror: writing'; m.className = "chip amber mirror writing";
  setTimeout(() => { const n = $("#mirror"); if (n) { n.className = "chip emerald mirror"; n.innerHTML = '<span class="dot"></span>mirror: synced'; } }, 900);
}

/* ───────────── floor ───────────── */
function renderFloor() {
  const f = $("#floor");
  const rows = LANES.map((l) => (S.focus ? (S.focus === l.id ? "minmax(0,1fr)" : "48px") : shelfCount(l) ? "minmax(0,1fr)" : "minmax(176px,.7fr)")).join(" ");
  const k = awaiting().length, run = S.runs.length;
  const shelfTotal = S.shelf.length + S.kept.length + S.projects.length + S.posts.length;
  f.innerHTML = `
    <div class="lanes" style="--rows:${rows}">
      <div class="colheads" role="presentation">
        <div class="colhead" style="border-right:1px solid var(--hair);background:var(--ink-1)"></div>
        <div class="colhead c-foundry">Foundry <span class="sub">draft · running</span> ${Tally(run, "running")}<a class="chip cyan" href="projects.html#runs" style="margin-left:auto" aria-label="runs across every resource">runs ›</a></div>
        <div class="colhead c-weir"><span class="weir-title">WEIR</span> <span class="sub">/board</span> ${Tally(k, "waiting")}</div>
        <div class="colhead c-shelf">Library · Projects <span class="sub">ratified</span></div>
      </div>
      ${LANES.map(Lane).join("")}
    </div>
    ${CalendarColumn()}`;
  if (S.spot) f.setAttribute("data-spot", S.spot); else f.removeAttribute("data-spot");
}
function Lane(l) {
  const collapsed = S.focus && S.focus !== l.id;
  const cls = collapsed ? "collapsed" : S.focus === l.id ? "focused" : "";
  return `<section class="lane ${cls}" data-component="Lane" data-lane="${l.id}" aria-label="${l.name} lane">
    <div class="lane-rail">
      <kbd class="keycap" aria-label="key ${l.n}">${l.n}</kbd>
      ${I[l.id]}
      <span class="lname">${l.name}</span>
      <button class="focus-btn" data-act="focus" data-lane="${l.id}" aria-label="${S.focus === l.id ? "show all lanes" : "focus " + l.name + " lane"}" aria-pressed="${S.focus === l.id}">${S.focus === l.id ? I.collapse : I.expand}</button>
    </div>
    <div class="cell c-foundry" data-component="FoundryCell" data-cell="foundry-${l.id}">${collapsed ? FoundrySummary(l) : IdeaComposer(l) + `<div data-component="RunTrack" id="track-${l.id}">${RunTrack(l)}</div>`}</div>
    <div class="cell c-weir" data-component="WeirCell" data-cell="weir-${l.id}">${collapsed ? WeirSummary(l) : WeirPiles(l)}<div class="sluice" id="sluice-${l.id}" aria-hidden="true"></div></div>
    <div class="cell c-shelf ${shelfCount(l) ? "" : "folded"}" data-component="ShelfCell" data-cell="shelf-${l.id}">${collapsed ? ShelfSummary(l) : Shelf(l)}</div>
  </section>`;
}
function FoundrySummary(l) {
  const r = S.runs.filter((x) => x.lane === l.id);
  return `<div class="summary"><span class="ttl">${l.name}</span>${r.length ? `<span class="state running">${r.length} running</span>` : `<span class="state draft">idle</span>`}</div>`;
}
function WeirSummary(l) {
  const a = awaiting(l.id); const items = a.reduce((n, p) => n + p.count, 0);
  let k = 0, x = 0, u = 0; a.forEach((p) => { const t = tallyOf(p); k += t.k; x += t.x; u += t.u; });
  return `<div class="summary">${Tally(a.length, "piles")} ${Tally(items, "items")} ${StackBar(k, x, u, l.name)}</div>`;
}
function shelfCount(l) { return { image: S.shelf.length, article: S.posts.length, audio: S.kept.length, video: S.projects.length }[l.id]; }
function ShelfSummary(l) {
  const n = shelfCount(l);
  return `<div class="summary"><span class="state ratified">${n} ${l.shelfName.toLowerCase()}</span></div>`;
}

/* composer */
function IdeaComposer(l) {
  const c = S.comp[l.id];
  let ctl = "", ph = "";
  if (l.id === "image") {
    const opts = (st) => `<option value="${st.id}" ${c.style === st.id ? "selected" : ""}>${esc(st.name)}</option>`;
    const cand = M.styles.filter((s) => !s.shelf && s.plates.length), prov = M.styles.filter((s) => s.shelf);
    ctl = `<div class="comp-row"><select class="comp-sel" data-comp="style" aria-label="style">
        <optgroup label="candidate · lock trial">${cand.map(opts).join("")}</optgroup>
        <optgroup label="proven · re-sweep">${prov.map(opts).join("")}</optgroup>
        <option value="__sweep" ${c.style === "__sweep" ? "selected" : ""}>Sweep · all ${forgeStyles.length} forge styles</option></select>
        <button class="toggle" type="button" data-comp="mech" aria-pressed="true" aria-label="mechanism ${mechLabel(c)}">${mechLabel(c)}</button></div>`;
    ph = "Riders crest the ridge at dawn, banners low…";
  } else if (l.id === "article") {
    const byB = {}; M.topics.forEach((t) => (byB[t.bundle] = byB[t.bundle] || []).push(t));
    ctl = `<div class="comp-row"><select class="comp-sel" data-comp="topic" aria-label="topic, ${M.topics.length} registry topics">${Object.keys(byB).map((b) => `<optgroup label="${esc(b)}">${byB[b].map((t) => `<option value="${t.slug}" ${c.topic === t.slug ? "selected" : ""}>${esc(t.title)}</option>`).join("")}</optgroup>`).join("")}</select></div>`;
    ph = "Angle: the budget is a clock, not a pool…";
  } else if (l.id === "audio") {
    ctl = `<div class="comp-row">${["music", "sfx"].map((k) => `<button class="toggle" data-comp="kind" data-kind="${k}" aria-pressed="${c.kind === k}">${k}</button>`).join("")}<span class="chip ghost" style="margin-left:auto">fixture</span></div>`;
    ph = M.hunts[0] ? M.hunts[0].idea.split(".")[0] + "…" : "A bed that holds a full minute…";
  } else {
    ctl = `<div class="comp-row"><select class="comp-sel" data-comp="subject" aria-label="strip subject">${["edu-radar", "edu-aqueduct", "edu-chokepoint"].map((s) => `<option value="${s}" ${c.subject === s ? "selected" : ""}>Strip · ${s}</option>`).join("")}</select></div>`;
    ph = "Radar sweeps; one blip stays when the rest fade…";
  }
  return `<form data-component="IdeaComposer" data-lane="${l.id}" aria-label="${l.name} idea" onsubmit="return false">
    ${ctl}
    <textarea class="comp-text" data-comp="text" rows="2" placeholder="${esc(ph)}" aria-label="first sentence">${esc(c.text)}</textarea>
    <div data-component="Estimate" id="est-${l.id}">${Estimate(l.id)}</div>
    <button class="launch" type="button" data-act="launch" data-lane="${l.id}">Launch <kbd class="keycap">⏎</kbd></button>
  </form>`;
}
function mechLabel(c) { return c.mechs.text && c.mechs["ref-early"] ? "text+ref" : c.mechs.text ? "text" : "ref-early"; }
function simImagePlates() {
  const c = S.comp.image;
  const mechs = Object.keys(c.mechs).filter((k) => c.mechs[k]);
  if (c.style === "__sweep") return forgeCands.filter((m) => mechs.includes(m.mechanism));
  const st = M.styleById[c.style];
  return (st ? st.plates : []).filter((m) => m.kind !== "forge.candidate" || mechs.includes(m.mechanism));
}
function laneActive(lane) { return S.runs.filter((r) => r.lane === lane).length; }
function Estimate(lane) {
  if (lane === "image") {
    const n = simImagePlates().length; const e = M.estimate.forge(1, n, 1);
    return `<span><b>${e.plates}</b> plates</span><span>~<b>${e.minutes}</b> min</span><span><b>$0</b> local</span><span>queue <b>#${laneActive("image") + 1}</b></span><span class="ill">illus.</span>`;
  }
  if (lane === "article") {
    const e = M.estimate.article();
    return `<span><b>$${e.usdRange[0]}–${e.usdRange[1]}</b></span><span>~<b>${e.minutes}</b> min</span><span>queue <b>#${laneActive("article") + 1}</b></span><span class="ill">pipeline hint</span>`;
  }
  if (lane === "audio") {
    const e = M.estimate.audio(1);
    return `<span><b>${e.clips}</b> clips</span><span>~<b>${e.minutes}</b> min</span><span>Suno queue <b>#${e.queueAhead + laneActive("audio")}</b></span><span class="ill">illus.</span>`;
  }
  return `<span><b>${stripPosters.filter((s) => s.card.startsWith(S.comp.video.subject)).length}</b> cards</span><span><b>240</b>f each</span><span><b>$0</b> code-rendered</span><span>~<b>2</b> min</span><span class="ill">illus.</span>`;
}

/* run track */
function DeliveredRow(p) {
  const it = p.rows ? flatItems(p)[0] : null; const pr = p.pairs ? p.pairs[0].a : null;
  const th = p.media === "audio" ? Wave(it && it.take.peaks, 46, 26, "#fbbf24") : (it && it.url) || pr ? `<img src="${(it && it.url) || pr.url}" alt="">` : p.export ? `<video src="../data/${p.export.file}#t=0.6" muted preload="metadata" aria-hidden="true" style="width:100%;height:100%;object-fit:cover"></video>` : `<span class="para">¶</span>`;
  return `<button data-component="RunRow" data-status="awaiting_gate" data-act="open" data-pid="${p.id}" style="text-align:left;opacity:.72">
    <div class="run-thumb">${th}</div>
    <div style="min-width:0"><div class="run-title">${esc(p.runId || (p.media === "article" ? titleCase(p.title) : p.title))}</div>
      <div class="run-meta"><span class="state awaiting_gate">at weir</span><span>${p.count} ${p.deskMode === "packet-review" ? "packet" : "items"}</span></div></div></button>`;
}
function RunTrack(l) {
  const runs = S.runs.filter((r) => r.lane === l.id);
  const delivered = awaiting(l.id).filter((p) => p.origin === "foundry" && !p.simulated);
  if (runs.length || delivered.length) return runs.map(RunRow).join("") + delivered.map(DeliveredRow).join("");
  if (!runs.length) return `<div class="fold-row">${Tally(0, "runs")}</div>`;
  return runs.map(RunRow).join("");
}
function RunRow(r) {
  let thumb = "";
  if (r.lane === "image" && r.out && r.out.length) thumb = `<img src="${r.out[Math.min(r.out.length - 1, Math.floor((r.progress || 0) * r.out.length))].url}" alt="">`;
  else if (r.lane === "video" && r.out && r.out.length) thumb = `<img src="${r.out[0].url}" alt="">`;
  else if (r.lane === "audio") thumb = Wave(r.peaks || M.unjudged[0].peaks, 46, 26, "#67e8f9");
  else thumb = `<span class="para">¶</span>`;
  let meta = "";
  if (r.lane === "article") { const si = ARTICLE_STAGES.indexOf(r.stage); meta = `<span class="stagepips" role="img" aria-label="stage ${r.stage}">${ARTICLE_STAGES.slice(0, 5).map((s, i) => `<i class="${i < si ? "done" : i === si ? "cur" : ""}"></i>`).join("")}</span><span>${esc(r.stage)}</span>`; }
  else if (r.lane === "image" && r.out) meta = `<span data-cnt>${Math.floor((r.progress || 0) * r.out.length)}/${r.out.length}</span><span>plates</span>`;
  else if (r.queue != null && r.status === "draft") meta = `<span>queue #${r.queue}</span>`;
  else if (r.queue != null) meta = `<span>queue ${r.queue}</span>`;
  const sim = r.sim ? `<span class="chip ghost" style="height:20px;font-size:12px">simulated</span>` : "";
  return `<div data-component="RunRow" data-run="${r.id}" data-status="${r.status}">
    <div class="run-thumb">${thumb}</div>
    <div style="min-width:0"><div class="run-title" title="">${esc(r.title)}</div>
      <div class="run-meta"><span class="state ${r.status}">${r.status}</span>${meta}${sim}</div>
      <div class="run-bar ${r.model ? "shimmer" : ""}"><i style="width:${Math.round((r.progress || 0) * 100)}%"></i></div></div>
  </div>`;
}
function refreshTrack(lane) { const t = $("#track-" + lane); if (t) t.innerHTML = RunTrack(laneById[lane]); }

/* weir piles */
/* covers measured near-black (mean luma under 16/255, 2026-10-14): never a pile's lead */
const DARK_COVER = new Set(["extract-2026-09-01-spiderverse-atsv-flat-black-field-replica-s02-r1.jpg", "extract-2026-09-01-spiderverse-atsv-flat-black-field-transfer-1.jpg", "extract-2026-09-01-spiderverse-atsv-src-s02.jpg", "extract-2026-09-01-spiderverse-atsv-src-s03.jpg", "extract-2026-09-01-spiderverse-atsv-black-photographic-void-transfer-1.jpg", "extract-2026-09-01-spiderverse-atsv-black-photographic-void-replica-s12-r1.jpg"]);
const readable = (it) => !DARK_COVER.has(String(it.url || "").split("/").pop());
function paletteOf(p) {
  const prj = S.projects.find((x) => x.id === p.projectId);
  const ids = [...(p.rows || []).flatMap((r) => [r.key, ...r.items.map((i) => i.style)]), prj && typeof prj.style === "string" ? prj.style : null];
  const st = ids.map((id) => M.styleById[id]).find(Boolean);
  return st && st.observables ? st.observables.palette_strategy : "";
}
/* the designed face: a pile's own data when its cover is missing or unreadable */
function CoverFace(p) {
  const kind = p.export ? (p.export.kind === "music-video" ? "mv" : p.export.kind) + " export" : (p.sourceKind || p.media);
  const id = p.runId || (p.export ? p.export.id.slice(0, 8) : p.id);
  const pal = paletteOf(p);
  return `<div class="sheet-l fb" role="img" aria-label="cover unavailable: ${esc(id)}, ${esc(kind)}, ${p.count} items${pal ? ", " + esc(pal) : ""}"><span class="fb-kind">${esc(kind)}</span><span class="fb-id">${esc(id)}</span>${pal ? `<span class="fb-pal">${esc(pal)}</span>` : ""}</div>`;
}
document.addEventListener("error", (e) => {
  const t = e.target; if (!(t instanceof HTMLImageElement || t instanceof HTMLVideoElement)) return;
  const pile = t.closest("[data-component=Pile]");
  const p = pile && S.packets.find((x) => x.id === pile.dataset.pid);
  if (p) { const f = pile.querySelector(".pile-face"); if (f) f.outerHTML = PileFace(p, true); return; }
  const th = t.closest(".run-thumb");
  if (th) { th.innerHTML = `<span class="para fb-glyph" role="img" aria-label="cover unavailable">${t instanceof HTMLVideoElement ? "▶" : "▣"}</span>`; return; }
  if (t instanceof HTMLImageElement) { const sq = document.createElement("span"); sq.className = "fb-sq"; sq.setAttribute("role", "img"); sq.setAttribute("aria-label", "cover unavailable"); sq.textContent = "no cover"; t.replaceWith(sq); }
}, true);
function PileFace(p, force) {
  const mode = `<span class="mode mode-glyph" aria-hidden="true">${MODE_ICON[p.deskMode]}</span>`;
  const tally = Tally(p.count);
  if (force) return `<div class="pile-face">${mode}${CoverFace(p)}${tally}</div>`;
  if (p.media === "article") return `<div class="pile-face">${mode}<div class="sheet-l l2 paper"></div><div class="sheet-l l1 paper"></div><div class="sheet-l paper"><small>turn ${p.turn || 1}</small><span class="pt">${esc(p.title)}</span></div>${tally}</div>`;
  if (p.media === "audio") { const its = flatItems(p).slice(0, 3); return `<div class="pile-face">${mode}${its.map((it, i) => `<div class="sheet-l wav ${i === 0 ? "l2" : i === 1 ? "l1" : ""}">${Wave(it.take.peaks, 96, 34, "#67e8f9")}</div>`).join("")}${tally}</div>`; }
  if (p.export) return `<div class="pile-face">${mode}<div class="sheet-l"><video src="../data/${p.export.file}#t=0.6" muted preload="metadata" aria-hidden="true"></video></div>${tally}</div>`;
  if (p.pairs) { const pr = p.pairs[0]; return `<div class="pile-face">${mode}<div class="sheet-l l2"></div><div class="sheet-l l1"></div><div class="sheet-l"><div class="halves"><img src="${pr.a.url}" alt=""><img src="${pr.b.url}" alt=""></div></div>${tally}</div>`; }
  const its = flatItems(p).filter(readable); const pick = [its[2], its[1], its[0]].filter(Boolean);
  if (!pick.length) return PileFace(p, true);

  const failed = S.slots.filter((s) => s.status === "failed" || s.status === "missed").sort((a, b) => new Date(b.publishAt) - new Date(a.publishAt));

function renderMonth() {

  else if (act === "caltoday") { S.calMonth = { y: 2026, m: 9 }; S.calDay = dayKey(M.NOW); renderMonth(); }
  else if (act === "calchan") { const c = b.dataset.chan; S.calChanOff[c] = !S.calChanOff[c]; renderMonth(); }
  else if (act === "calday") { if (e.target.closest(".mslot")) return; S.calDay = b.dataset.day ? (S.calDay === b.dataset.day ? null : b.dataset.day) : null; renderMonth(); const d = S.calDay && $(`#month .mday[data-day="${S.calDay}"]`); if (d) d.focus({ preventScroll: true }); }
});

/* ───────────── the ledger: every act on the floor is appended ───────────── */
const OPERATOR = { kind: "operator", id: "operator" };
const _decide = M.decide;
M.decide = function (packetId, verdict, payload) {
  const rec = _decide(packetId, verdict, payload);
  const p = S.packets.find((x) => x.id === packetId);
  const note = payload && payload.kept ? `kept ${payload.kept.length} · rejected ${(payload.rejected || []).length}` : payload && payload.picks ? `${payload.picks.length} picks · agree ${payload.picks.filter((q) => q.agree).length}` : payload && payload.channel ? `${payload.channel} · ${payload.publishAt.slice(0, 16)}Z` : payload && payload.notes ? `${payload.notes.length} notes` : null;
  GT.store.emit({ type: verdict === "reject" ? "verdict.reject" : verdict === "edit-plan" ? "gate.edit-plan" : "commit", actor: OPERATOR, subject: { kind: "packet", id: packetId, label: p ? (p.media === "article" ? titleCase(p.title) : p.title) : packetId, href: "index.html#open=" + packetId }, packetId, verdict, note, runId: p && p.runId, projectId: p && p.projectId, decision: rec.id });
  return rec;
};
const laneOfMedia = { image: "gpu.local", article: "seat.text", audio: "box.chrome", video: "box.render" };
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act === "open") openPacket(b.dataset.pid);
  else if (act === "close") closeLevel();
  else if (act === "board") nav("board");
  else if (act === "nav") nav(b.dataset.nav);
  else if (act === "focus") { S.focus = S.focus === b.dataset.lane ? null : b.dataset.lane; renderFloor(); }
  else if (act === "launch") launchRun(b.dataset.lane);
  else if (act === "style") openLevel({ kind: "style", id: b.dataset.id });
  else if (act === "project") openLevel({ kind: "project", id: b.dataset.id });
  else if (act === "slot") openLevel({ kind: "slot", id: b.dataset.id });
  else if (act === "play") { e.stopPropagation(); const t = M.takes.find((x) => x.id === b.dataset.take) || S.kept.find((x) => x.id === b.dataset.take); if (t) playTake(t); }
  else if (act === "spawn") {
    const t = S.kept.find((x) => x.id === b.dataset.take); if (!t) return;
    const from = b.getBoundingClientRect();
    const prj = spawnProject(t); if (!prj) return;
    GT.journal.add({ k: "spawnmv", take: t.id });
    if (S.focus && S.focus !== "audio" && S.focus !== "video") S.focus = null;
    if (S.focus === "audio") S.focus = null;
    renderFloor(); mirrorPulse();
    flyThrough(from, `[data-project="${prj.id}"]`, waveThumb(t), "audio", 0).then(() => { const el = $(`[data-project="${prj.id}"]`); if (el) { el.classList.remove("arriving"); el.classList.add("locked-in"); } delete prj.fresh; });
    toast(`MV project spawned · ${esc(prj.title)} · encode ~${M.estimate.mv().minutes} min`, true);
  }
  else if (act === "tile") { const p = curPacket(); const c = cullState(p); const i = +b.dataset.tile; if (i === c.cur) { S.zoom = true; paintCull(p); } else cullMove(p, i); }
  else if (act === "commit") { const p = curPacket(); p.deskMode === "matrix-cull" ? commitCull(p) : commitPair(p); }
  else if (act === "pick") pairPick(curPacket(), b.dataset.pick);
  else if (act === "approve") approveReview(curPacket());
  else if (act === "reject") rejectPacket(curPacket());
  else if (act === "editplan") sendEditPlan(curPacket());
  else if (act === "note") { e.stopPropagation(); openNote(curPacket(), +b.dataset.i); }
  else if (act === "secfocus") { if (e.target.closest("[data-noclick]")) return; const p = curPacket(); const st = reviewState(p); if (st.editing != null) return; st.focus = +b.dataset.i; renderDesk(); }
  else if (act === "dir") { const p = curPacket(); const st = reviewState(p); st.dir = b.dataset.dir; const v = ($("#note-text") || {}).value; renderDesk(); const inp = $("#note-text"); if (inp) { inp.value = v || ""; inp.focus(); } }
  else if (act === "beat") { const p = curPacket(); const c = cutState(p); c.focus = +b.dataset.i; c.editing = null; renderDesk(); seekBeat(p); }
  else if (act === "chan") { const p = curPacket(); if (cutState(p).chan !== b.dataset.chan) GT.journal.add({ k: "chan", pid: p.id, chan: b.dataset.chan }); cutState(p).chan = b.dataset.chan; renderDesk(); }
});
$("#scrim").addEventListener("click", closeLevel);
function curPacket() { return S.level && S.level.kind === "board" ? S.packets.find((x) => x.id === S.level.id) : null; }

// composer inputs
document.addEventListener("input", (e) => {
  const el = e.target; const f = el.closest("[data-component=IdeaComposer]"); if (!f) return;
  const lane = f.dataset.lane; const c = S.comp[lane];
  if (el.dataset.comp === "text") c.text = el.value;
  else if (el.dataset.comp === "style") c.style = el.value;
  else if (el.dataset.comp === "topic") c.topic = el.value;
  else if (el.dataset.comp === "subject") c.subject = el.value;
  const est = $("#est-" + lane); if (est) est.innerHTML = Estimate(lane);
});
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-comp]"); if (!b || b.tagName !== "BUTTON") return;
  const f = b.closest("[data-component=IdeaComposer]"); const lane = f.dataset.lane; const c = S.comp[lane];
  if (b.dataset.comp === "mech") { const cur = mechLabel(c); c.mechs = cur === "text+ref" ? { text: true } : cur === "text" ? { "ref-early": true } : { text: true, "ref-early": true }; b.textContent = mechLabel(c); b.setAttribute("aria-label", "mechanism " + mechLabel(c)); }
  if (b.dataset.comp === "kind") { c.kind = b.dataset.kind; $$('[data-comp="kind"]', f).forEach((x) => x.setAttribute("aria-pressed", x.dataset.kind === c.kind)); }
  const est = $("#est-" + lane); if (est) est.innerHTML = Estimate(lane);
});

document.addEventListener("keydown", (e) => {
  const tgt = e.target; const typing = tgt && (tgt.tagName === "INPUT" || tgt.tagName === "TEXTAREA" || tgt.tagName === "SELECT");
  // note editor inside article review
  if (tgt && tgt.id === "note-text" && curPacket() && curPacket().media === "video") {
    const p = curPacket(); const c = cutState(p);
    if (e.key === "Enter") { e.preventDefault(); if (tgt.value.trim()) { c.notes[c.editing] = tgt.value.trim(); GT.journal.add({ k: "cutnote", pid: p.id, i: c.editing, text: c.notes[c.editing] }); } c.editing = null; renderDesk(); }
    else if (e.key === "Escape") { e.preventDefault(); c.editing = null; renderDesk(); }
    return;
  }
  if (tgt && tgt.id === "note-text") {
    const p = curPacket(); const st = reviewState(p);
    if (e.key === "Enter") { e.preventDefault(); const sec = p.draft.sections[st.editing]; st.notes.push({ section: sec.id, directive: st.dir, text: tgt.value.trim() || st.dir.replace("_", " ") }); GT.journal.add({ k: "note", pid: p.id, ...st.notes[st.notes.length - 1] }); st.editing = null; renderDesk(); announce("note attached to §" + (p.draft.sections.indexOf(sec) + 1)); }
    else if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); st.editing = null; renderDesk(); }
    else if (e.key === "Tab") { e.preventDefault(); const i = DIRECTIVES.indexOf(st.dir); st.dir = DIRECTIVES[(i + (e.shiftKey ? DIRECTIVES.length - 1 : 1)) % DIRECTIVES.length]; const v = tgt.value; renderDesk(); const inp = $("#note-text"); inp.value = v; inp.focus(); }
    return;
  }
  if (typing) {
    const f = tgt.closest("[data-component=IdeaComposer]");
    if (f && e.key === "Enter" && (tgt.tagName !== "TEXTAREA" || !e.shiftKey)) { e.preventDefault(); launchRun(f.dataset.lane); }
    if (e.key === "Escape") tgt.blur();
    return;
  }
  if (S.level) {
    if (e.key === "Escape") { e.preventDefault(); if (S.zoom) { S.zoom = false; const z = $("#zoom"); if (z) z.remove(); return; } return closeLevel(); }
    const p = curPacket();
    if (p && p.status === "awaiting_gate") {
      if (e.key === "]" || e.key === "[") { const a = awaiting(); const i = a.indexOf(p); const n = a[(i + (e.key === "]" ? 1 : a.length - 1)) % a.length]; if (n) openPacket(n.id); e.preventDefault(); return; }
      if (p.deskMode === "matrix-cull") return cullKey(p, e);
      if (p.deskMode === "blind-pair") return pairKey(p, e);
      if (p.media === "article") return reviewKey(p, e);
      return cutKey(p, e);
    }
    if (p && e.key === "Enter") { const n = nextPacket(); if (n) { e.preventDefault(); openPacket(n.id); } }
    return;
  }
  if (S.cal) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key;
    if (k === "Escape") { e.preventDefault(); if (S.calDay) { S.calDay = null; renderMonth(); } else setCal(false); return; }
    if (k === "c" || k === "C") { e.preventDefault(); return setCal(false); }
    if (k === "ArrowRight") { e.preventDefault(); return calMoveDay(1); }
    if (k === "ArrowLeft") { e.preventDefault(); return calMoveDay(-1); }
    if (k === "ArrowDown") { e.preventDefault(); return calMoveDay(7); }
    if (k === "ArrowUp") { e.preventDefault(); return calMoveDay(-7); }
    if (k === "[" || k === "]") { e.preventDefault(); let { y, m } = S.calMonth; m += k === "]" ? 1 : -1; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } S.calMonth = { y, m }; S.calDay = null; return renderMonth(); }
    if (k === "Enter" && S.calDay) { const first = monthSlots().filter((s) => s.publishAt.slice(0, 10) === S.calDay)[0]; if (first) { e.preventDefault(); openLevel({ kind: "slot", id: first.id }); } return; }
    if (k === "b" || k === "B") { setCal(false); return nav("board"); }
    return;
  }
  // floor
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "c" || e.key === "C") { e.preventDefault(); return setCal(true); }
  const digit = e.code && e.code.startsWith("Digit") ? +e.code.slice(5) : NaN;
  if (digit >= 1 && digit <= 4) {
    const l = LANES[digit - 1]; e.preventDefault();
    if (e.shiftKey) { S.focus = S.focus === l.id ? null : l.id; renderFloor(); return; }
    const a = awaiting(l.id); if (a.length) openPacket(a[0].id); else toast(`${l.name} · weir clear`);
  } else if (e.key === "Enter") { const n = nextPacket(); if (n && !(tgt && tgt.tagName === "BUTTON")) { e.preventDefault(); openPacket(n.id); } }
  else if (e.key === "Escape" && S.focus) { S.focus = null; renderFloor(); }
  else if (e.key.toLowerCase() === "b") nav("board");
});

/* ───────────── boot: the journal re-applies the acts over the fixture baseline ───────────── */
function replayJournal() {
  GT.journal.replay((acts) => acts.forEach((e) => {
    try {
      const p = e.pid ? S.packets.find((x) => x.id === e.pid) : null;
      if (e.k === "launch") { S.comp[e.lane] = JSON.parse(JSON.stringify(e.comp)); launchRun(e.lane); }
      else if (e.k === "arrive") { const r = S.runs.find((x) => x.id === e.rid); if (r) arrive(r, e.digest); }
      else if (e.k === "spawnmv") { const t = S.kept.find((x) => x.id === e.take); if (t) spawnProject(t); }
      else if (!p) return;
      else if (e.k === "mark") cullApply(p, e.idxs, e.v, e.reason);
      else if (e.k === "undo") cullUndoApply(p);
      else if (e.k === "spawnmark") { const c = cullState(p); c.spawn[e.i] = !c.spawn[e.i]; if (!c.spawn[e.i]) delete c.spawn[e.i]; }
      else if (e.k === "pick") pairApply(p, e.pick);
      else if (e.k === "pairback") { const st = pairState(p); if (st.i > 0) { st.i--; st.picks.pop(); } }
      else if (e.k === "note") reviewState(p).notes.push({ section: e.section, directive: e.directive, text: e.text });
      else if (e.k === "cutnote") cutState(p).notes[e.i] = e.text;
      else if (e.k === "chan") cutState(p).chan = e.chan;
      else if (e.k === "commit") (p.deskMode === "matrix-cull" ? commitCull : commitPair)(p);
      else if (e.k === "approve") approveReview(p);
      else if (e.k === "reject") rejectPacket(p);
      else if (e.k === "editplan") sendEditPlan(p);
    } catch (err) { /* one stale entry never blocks the floor */ }
  }));
}
replayJournal();
renderHeader(); renderFloor();
function fromHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (!h) return;
  if (h === "calendar") return setCal(true);
  if (h === "board") return nav("board");
  const [k, v] = h.split("=");
  if (k === "open" && S.packets.find((x) => x.id === v)) return openPacket(v);
  if (k === "slot" && S.slots.find((x) => x.id === v)) return openLevel({ kind: "slot", id: v });
  if (k === "project" && S.projects.find((x) => x.id === v)) return openLevel({ kind: "project", id: v });
  if (k === "style") return openLevel({ kind: "style", id: v });
}
fromHash();
window.addEventListener("hashchange", fromHash);
setInterval(tick, 120);
// the model's own running runs keep moving (shimmer) — nothing completes on its own; the gate is the operator's.
})();
</script>
